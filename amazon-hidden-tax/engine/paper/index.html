hoever controls the shelf controls the business."}, {"label": "3. The Pay-to-Play Shelf", "val": "Count the 'Sponsored'", "activeLayer": 2, "sub": "Every slot is a seller bidding per click against other sellers for the same customer.", "broll": "Creator's own phone screen recording of an Amazon search", "step": 3, "cue": "So Amazon turned the shelf into an", "narration": "So Amazon turned the shelf into an auction. Try it yourself: search for almost anything on your phone... and count the \"Sponsored\" results before the first one that isn't. Every slot is a seller bidding, per click, against other sellers."}, {"label": "4. The Hidden Surcharge (Alleged)", "val": "Up to +250% on Peak Days", "activeLayer": 2, "accent": "loss", "sub": "FTC + 22 states allege a secret surcharge on top of auction prices since 2019: $20B+ overcharged.", "evidence": {"doc": "FTC et al. v. Amazon.com, Inc. (W.D. Wash.), filed Aug. 31, 2026", "quote": "Alleged: up to 50% above auction results on ordinary days, up to 250% on peak days"}, "step": 4, "cue": "And according to a new lawsuit, even", "narration": "And according to a new lawsuit, even the auction may not be what it seems. In August 2026, the FTC and twenty-two states sued Amazon, alleging that since 2019 it secretly added a surcharge on top of auction prices. Documents unsealed in November allege prices up to fifty percent above the auction result on ordinary days... and up to two hundred and fifty percent on days like Prime Day. The FTC puts the total overcharge at more than twenty billion dollars. Amazon calls the suit misguided, and says it never charges more than an advertiser's maximum bid."}, {"label": "5. The Bottleneck", "val": "≈52% Take Rate", "activeLayer": 3, "sub": "Fees + ads ≈ 52% of seller sales (Marketplace Pulse, 2022 average: 51.8%).", "step": 5, "cue": "For sellers, it's a prisoner's dilemma: bid", "narration": "For sellers, it's a prisoner's dilemma: bid away your margin... or disappear. So why don't they just charge less everywhere else? Because if they try... a bot is watching."}]}, {"scene": 3, "part": 3, "mode": "compare", "tag": "FTC v. AMAZON · ALLEGATIONS", "title": "The Price Floor & Project Nessie", "unit": "", "footnote": "FTC claims are allegations; Amazon denies wrongdoing. Buy Box share is an industry estimate not confirmed by Amazon.", "steps": [{"label": "1. The Price-Parity Trap", "unit": "$", "leftVal": 100, "rightVal": 85, "leftText": "Amazon listing: $100", "rightText": "Own Shopify store: $85", "leftTo": "amazon", "rightTo": "seller", "sub": "What happens when a seller charges less off Amazon?", "evidence": {"doc": "FTC et al. v. Amazon.com, Inc., No. 2:23-cv-01495 (W.D. Wash.)", "line": "Complaint filed Sept. 26, 2023"}, "step": 1, "cue": "In 2023, the Federal Trade Commission and", "narration": "In 2023, the Federal Trade Commission and a group of states sued Amazon for illegally maintaining a monopoly. The complaint describes what happens when a seller tries to undercut Amazon. Say you sell a dress for one hundred dollars on Amazon... and eighty-five on your own Shopify store, where your fees are lower."}, {"label": "2. The Buy Box", "unit": "%", "leftVal": 80, "rightVal": 20, "estimate": true, "leftText": "Through the Buy Box: 80%+", "rightText": "Everything else: <20%", "leftTo": "amazon", "rightTo": "supplier", "sub": "FTC: discounting sellers can become \"effectively invisible.\"", "evidence": {"doc": "FTC et al. v. Amazon.com, Inc., No. 2:23-cv-01495 (W.D. Wash.), Dkt. 1, p. 9", "quote": "\"a price floor everywhere else\""}, "step": 2, "cue": "According to the FTC, Amazon's algorithms scan", "narration": "According to the FTC, Amazon's algorithms scan the internet for lower prices. If they find one, your offer can lose the Buy Box — that yellow \"Add to Cart\" button. Industry estimates — never confirmed by Amazon — say more than eighty percent of sales go through it. The complaint goes further. It says Amazon can bury discounting sellers so far down in search results that they become — quote — \"effectively invisible.\" So sellers do the rational thing. In the FTC's words, they use their inflated Amazon prices as \"a price floor everywhere else\"... which means, if the government is right, you pay the Amazon tax even at other stores."}, {"label": "3. Project Nessie", "unit": "$", "leftVal": 110, "rightVal": 110, "illustrative": true, "leftText": "Amazon raises its price", "rightText": "Rival algorithms follow", "leftTo": "amazon", "rightTo": "supplier", "sub": "FTC alleges $1B+ in extra profit. Amazon: the FTC \"grossly mischaracterizes\" the tool.", "evidence": {"doc": "Unredacted FTC complaint (Nov. 2023)", "quote": "Alleged: more than $1 billion in excess profit"}, "step": 3, "cue": "Then there's Project Nessie — an algorithm", "narration": "Then there's Project Nessie — an algorithm the FTC says predicted when competitors would match Amazon's price increases... so Amazon could raise prices and watch rivals follow. The agency alleges it generated more than one billion dollars in extra profit. Amazon says the FTC \"grossly mischaracterizes\" the tool — and that it was scrapped because it didn't work as intended. More broadly, Amazon says the lawsuit is wrong on the facts and the law. But there's one cost we haven't counted yet... the one that arrives after the sale is over."}]}, {"scene": 4, "part": 4, "mode": "waterfall", "tag": "REVERSE LOGISTICS AUTOPSY", "title": "The True Cost of One \"Free\" $100 Return", "unit": " USD", "currency": "USD", "footnote": "One worn $100 dress · 17% referral fee · ≈ values vary by size and weight · Sources: NRF 2025; Appriss Retail; Amazon fee policies 2026", "steps": [{"label": "Sale Reversed", "val": 0, "type": "start", "to": "seller", "sub": "The customer gets $100 back. The sale no longer exists.", "stats": ["~$850B returned in 2025 (NRF)", "~1 in 5 online purchases returned"], "step": 1, "cue": "Now for the cost that comes back", "narration": "Now for the cost that comes back in a box. According to the National Retail Federation, roughly one in five online purchases gets sent back. And in fashion, one kind of return has its own name. Wardrobing. Buy an evening dress on Friday. Wear it to a wedding on Saturday. Return it on Monday — \"didn't fit.\" In one industry survey, six in ten retail executives said they'd seen it. For the shopper, the return is free. For the seller, here's what one worn, one-hundred-dollar dress actually costs."}, {"label": "Refund Admin Fee", "val": -3.4, "type": "cost", "to": "amazon", "sub": "Amazon keeps 20% of the $17 referral fee (capped at $5).", "step": 2, "cue": "The customer gets their hundred dollars back.", "narration": "The customer gets their hundred dollars back. Amazon refunds most of its referral fee... but keeps a refund administration fee. Three dollars and forty cents."}, {"label": "FBA Fee Not Refunded", "val": -6, "display": "≈−$6", "type": "cost", "to": "amazon", "sub": "The fulfillment fee Amazon charged to ship the dress is gone.", "step": 3, "cue": "The fulfillment fee Amazon charged to ship", "narration": "The fulfillment fee Amazon charged to ship the dress? Not refunded. About six dollars... gone."}, {"label": "Returns Processing", "val": -3, "display": "≈−$3", "type": "cost", "to": "amazon", "sub": "Apparel returns processing fee (roughly $1.65–$3.89 by size).", "step": 4, "cue": "Then, a returns processing fee. Around three", "narration": "Then, a returns processing fee. Around three dollars more."}, {"label": "Worn Dress Written Off", "val": -28, "type": "cost", "to": "loss", "sub": "Makeup and perfume: it can't be sold as new.", "step": 5, "cue": "And the dress itself comes back with", "narration": "And the dress itself comes back with makeup on the collar and perfume in the fabric. It can't be sold as new. Twenty-eight dollars of inventory... written off."}, {"label": "Net Loss", "val": -40.4, "type": "final", "to": "loss", "sub": "= the profit from four full-price sales at a 10% margin.", "callout": {"pos": "bl", "boxes": [{"title": "One wardrobed return", "big": "−$40.40", "sub": "wipes out the profit from 4 full-price sales", "to": "loss"}]}, "step": 6, "cue": "Total: a loss of about forty dollars", "narration": "Total: a loss of about forty dollars and forty cents — on a sale that no longer exists. At a ten percent margin, that's four full-price sales... just to pay for one wardrobed dress. And even the sellers who survive returns run into one more problem. Time."}]}, {"scene": 5, "part": 5, "mode": "network", "tag": "THE WORKING-CAPITAL SQUEEZE", "title": "Cash Out First, Paid Last — Fined Either Way", "unit": "", "footnote": "Sources: Amazon seller policies (delivery-date reserve, inbound placement, low-inventory-level fee); 3.5% surcharge eff. Apr 17, 2026; Marketplace Pulse 2026 Seller Index", "layers": [[{"name": "Factory (paid up front)", "y": 0.5}], [{"name": "Payout reserve (delivery + 7 days)", "y": 0.5}], [{"name": "Inbound placement fee · +3.5% surcharge", "y": 0.5}], [{"name": "Too much stock: aged-inventory surcharge", "y": 0.3}, {"name": "Under ~28 days: low-inventory fee", "y": 0.7}]], "steps": [{"label": "1. Factory Cash Goes Out", "val": "2–3 Months Early", "activeLayer": 0, "sub": "Sellers pay factories long before a single unit reaches a customer.", "step": 1, "cue": "So far, that's fifty-two dollars in fees", "narration": "So far, that's fifty-two dollars in fees and ads... and forty more every time a dress comes back. But the last trap isn't a fee at all. Selling on Amazon starts with a bet. Sellers pay their factories up front — often two or three months before a single unit reaches a customer."}, {"label": "2. The Payout Reserve", "val": "Delivery + 7 Days", "activeLayer": 1, "sub": "Funds release 7 days after confirmed delivery — often 2–4 weeks from sale to bank.", "step": 2, "cue": "Then, when the sale finally happens, the", "narration": "Then, when the sale finally happens, the money still doesn't arrive. Under Amazon's current rules, seller funds generally become available seven days after the customer's confirmed delivery. Add settlement cycles on top, and many sellers wait two to four weeks to touch their own revenue."}, {"label": "3. Fees Around Inventory", "val": "+3.5% Surcharge", "activeLayer": 2, "sub": "Inbound placement fee (since 2024) + 3.5% on every fulfillment fee (April 2026).", "step": 3, "cue": "Meanwhile, the fees keep multiplying. Since 2024,", "narration": "Meanwhile, the fees keep multiplying. Since 2024, there's a fee for how your boxes get spread across Amazon's warehouses. And in 2026, a three-and-a-half percent surcharge landed on top of every fulfillment fee."}, {"label": "4. The Corridor", "val": "Too Much OR Too Little", "activeLayer": 3, "sub": "Aged-inventory surcharge vs. low-inventory fee. 49% of sellers call fees their #1 margin concern.", "step": 4, "cue": "And then there's the corridor. Keep too", "narration": "And then there's the corridor. Keep too much stock for too long, and you pay aged inventory surcharges. But let your stock fall below roughly twenty-eight days of supply... and you pay a low-inventory-level fee on every unit shipped. Too much costs money. Too little costs money. Amazon collects on both sides. So... why does anyone stay?"}]}, {"scene": 6, "part": 6, "mode": "compare", "tag": "WHO REALLY GETS YOUR $100", "title": "The Tollbooth, Then and Now", "unit": "", "footnote": "Sources: Stripe standard pricing; Amazon 2020 shareholder letter; Marketplace Pulse; FTC v. Amazon (W.D. Wash.)", "steps": [{"label": "1. The Alternative Isn't Free", "unit": "$", "leftVal": 52, "rightVal": 3.2, "leftText": "Amazon: fees + ads ≈ $52", "rightText": "Own store: card fee ≈ $3.20 + paid traffic (?)", "leftTo": "amazon", "rightTo": "seller", "sub": "2.9% + 30¢ to process the card — but the customers still have to be bought on Google, Meta or TikTok.", "step": 1, "cue": "On your own website, the payment processor", "narration": "On your own website, the payment processor takes about three dollars on a hundred-dollar sale. Sounds like a bargain... until you realize the customers don't come with it. You have to buy them — one click at a time — on Google, Meta, or TikTok. A different auction... with the same tollbooth logic. And Amazon does deliver something real. Over two hundred million Prime members, fast delivery, and a checkout button people trust without thinking. That's what sellers are paying for."}, {"label": "2. What Changed Is the Price", "unit": "%", "leftVal": 35.2, "rightVal": 51.8, "leftText": "2016: 35.2%", "rightText": "2022: 51.8%", "leftTo": "supplier", "rightTo": "amazon", "sub": "Amazon's average cut of seller sales (Marketplace Pulse).", "evidence": {"doc": "FTC et al. v. Amazon.com, Inc., No. 2:23-cv-01495 (W.D. Wash.)", "line": "Bench trial scheduled for 2027"}, "step": 2, "cue": "What's changed is the price. In 2016,", "narration": "What's changed is the price. In 2016, Amazon's cut was about a third of a seller's revenue. By 2022, it was more than half. And in 2027, a federal judge in Seattle will start deciding whether parts of how Amazon got here broke the law. If the FTC wins, the Buy Box rules could change... and with them, prices across the internet. If Amazon wins, the tollbooth stays."}, {"label": "3. Back to the $100", "unit": "$", "leftVal": 10, "rightVal": 52, "leftText": "Seller keeps: $10", "rightText": "Amazon collects: $52", "leftTo": "seller", "rightTo": "amazon", "sub": "The fortune belongs to whoever controls the last three seconds before checkout.", "step": 3, "cue": "So... back to where we started. When", "narration": "So... back to where we started. When you spend one hundred dollars with a seller on Amazon — who actually gets your money? About ten dollars goes to the business that made the product. About fifty-two goes to the company that owns the shelf. In modern commerce, the company that makes the product rarely gets rich. The fortune belongs       for (let i = 0; i < LANES; i++) { const s = new THREE.Mesh(new THREE.PlaneGeometry(2.8, 0.875), new THREE.MeshBasicMaterial({ map: signTex }));
        s.position.set((i - 1) * LW, 5.2, gz + 0.3); scene.add(s); }
      // barrier arms
      const arms = [];
      for (let i = 0; i < LANES; i++) {
        const pivot = new THREE.Group(); pivot.position.set((i - 1) * LW - LW / 2 + 0.25, 1.1, gz + 1.2);
        const arm = new THREE.Mesh(new THREE.BoxGeometry(LW - 0.4, 0.18, 0.18), mat("#faf7ef", "200,16,46")); arm.position.x = (LW - 0.4) / 2; pivot.add(arm);
        for (let k = 0; k < 4; k++) { const st = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.2, 0.2), new THREE.MeshBasicMaterial({ color: 0xc8102e })); st.position.x = 0.4 + k * 0.75; pivot.add(st); }
        scene.add(pivot); arms.push(pivot);
      }
      // booth
      const booth = new THREE.Mesh(new THREE.BoxGeometry(1.4, 2.6, 1.6), mat("#ede6d6", "60,40,20")); booth.position.set(-LW * 1.5 - 1.6, 1.3, gz + 1.0); scene.add(booth);
      const roof = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.25, 2.1), post); roof.position.set(booth.position.x, 2.75, booth.position.z); scene.add(roof);
      // queued product boxes (kraft) per lane
      const boxMat = mat("#b98e55", "70,40,10", 1), boxes = [];
      for (let i = 0; i < LANES; i++) for (let k = 0; k < 6; k++) {
        const b = new THREE.Mesh(new THREE.BoxGeometry(1.3, 1.0, 1.3), boxMat); b.userData = { lane: i, k }; scene.add(b); boxes.push(b);
        const tape = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.02, 1.32), new THREE.MeshBasicMaterial({ color: 0xd9c49a })); b.add(tape);
      }
      // coins piling next to the booth
      const coinMat = new THREE.MeshToonMaterial({ color: 0xc9a227 }), coins = [];
      for (let k = 0; k < 18; k++) { const c = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.08, 24), coinMat); scene.add(c); coins.push(c); }
      scene.add(new THREE.HemisphereLight(0xfff6e6, 0x8a7350, 1.6));
      const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-8, 14, 10); scene.add(sun);

        document.fonts.ready.then(() => { drawSign(); });
        return function (p, shot) {
        if (shot === 1) { camera.position.set(-1.5 + p * 3, 4.6, 7.5 - p * 2); camera.lookAt(0, 4.9, gz); }
        else if (shot === 2) { camera.position.set(6.2 - p, 1.5, 7.5 - p * 3); camera.lookAt(2.6, 1.3, gz - 5); }
        else if (shot === 3) { camera.position.set(0.01, 19 - p * 3, gz + 1); camera.lookAt(0, 0, gz - 4); }
        else { camera.position.set(9 - p * 6, 7.5 - p * 3, 14 - p * 5); camera.lookAt(0, 2.2, gz - 2 + p * 1.5); }
        const WIN = 2; // the highest bidder's lane
        boxes.forEach((b) => { const { lane, k } = b.userData;
          const creep = Math.min(1.4, p * 2.2);                        // everyone rolls up to the barrier
          const pass = lane === WIN ? Math.max(0, p - 0.45) * 18 : 0;  // only the winner goes through
          b.position.set((lane - 1) * LW, 0.5, gz - 2.2 - k * 2.2 + creep + pass); });
        arms.forEach((a, i) => { const open = i === WIN ? Math.max(0, Math.min(1, (p - 0.3) * 5)) : 0; a.rotation.z = open * 1.3; });
        coins.forEach((c, k) => { const t = Math.max(0, Math.min(1, p * 2.2 - k * 0.08)); c.position.set(booth.position.x + 1.4 + (k % 3) * 0.1, 0.05 + Math.floor(k / 3) * 0.085 + (1 - t) * 4, gz + 2.4 + (k % 2) * 0.05); c.visible = t > 0; });
        renderer.render(scene, camera);
        };
      }

      const tl = gsap.timeline({ paused: true });
      Paper.build(tl, SCENES, TIMELINE, { kinetic: KINETIC, toll, subs: SUBS });
      tl.set({}, {}, 564.921);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
