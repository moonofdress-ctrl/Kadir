grade":"night","motif":"tent","light":{"x":960,"y":200,"r":800,"color":"#ffe14d","dark":0.6},"props":[{"type":"tent","x":960,"y":930,"w":1900,"inside":true,"night":true,"frayed":2,"tilt":6}],"actors":[{"who":"BENNY","x":780,"face":"confused","look":"up","speaks":["L164"],"enter":"none"},{"who":"HAL","x":1140,"face":"deadpan","look":"up","prop":"mug","flip":true,"speaks":["L165"],"enter":"none"}]},{"id":"c9t09","type":"card","cue":"L166","text":"So why is Nvidia down over its CEO?","emph":["CEO?"]},{"id":"c9s56","cue":"L167","set":"lawn","opts":{"time":"dusk"},"camera":"pull_out","grade":"night","motif":"tent","callback":"the opening tent and chip (0:00)","light":{"x":960,"y":300,"r":900,"color":"#ffe14d","dark":0.6},"props":[{"type":"tent","x":960,"y":930,"w":1600,"ropes":6,"frayed":2,"tilt":6,"crowd":300,"night":true,"flag":"AS OF WED 11 NOV, NIGHT"}],"actors":[{"thing":"chip","label":"NVIDIA","x":960,"y":380,"scale":0.5,"face":"scared","enter":"none","acts":[{"cue":"L167","word":12,"face":"sad"}]},{"who":"SAVER","x":520,"y":970,"scale":0.5,"face":"neutral","enter":"none","acts":[{"cue":"L167","word":12,"look":"up","face":"shocked"}]},{"who":"MARTHA","x":1400,"y":970,"scale":0.5,"face":"neutral","prop":"bill","enter":"none","acts":[{"cue":"L167","word":13,"look":"up","face":"scared"}]}]},{"id":"c9s57","cue":"L168","set":"lawn","opts":{"time":"dusk"},"camera":"tilt_up","grade":"night","motif":"tent","callback":"Benny's jar and the one pole","light":{"x":900,"y":420,"r":820,"color":"#ffe14d","dark":0.5},"props":[{"type":"tent","x":960,"y":930,"w":1900,"inside":true,"night":true,"frayed":2,"tilt":6},{"type":"jar","x":1180,"y":900,"t":"RETIREMENT","amount":"$100,000","level":0.8}],"actors":[{"who":"BENNY","x":900,"scale":0.85,"face":"confused","look":"up","pose":"point","enter":"none","acts":[{"at":0.6,"face":"shocked"}]}]}]}, [{"id":"L001","speaker":"N","text":"In two days, Nvidia lost about four hundred and thirty billion dollars in value... and no one had reported it selling one chip less.","d":8.11,"est":false,"a":0.2},{"id":"L002","speaker":"N","text":"No factory closed.","d":1.33,"est":false,"a":8.45},{"id":"L003","speaker":"N","text":"No customer walked away.","d":1.55,"est":false,"a":9.92},{"id":"L004","speaker":"N","text":"No forecast was cut.","d":1.34,"est":false,"a":11.61},{"id":"L005","speaker":"N","text":"So why is Nvidia down over its CEO?","d":2.54,"est":false,"a":13.09},{"id":"L006","speaker":"BENNY","text":"I don't even own Nvidia.","d":1.644,"est":false,"a":15.81},{"id":"L007","speaker":"HAL","text":"You own an index fund. You own a lot of Nvidia.","d":3.75,"est":false,"a":17.594},{"id":"L008","speaker":"N","text":"The short answer is three things. One man. One empty chair. And one argument in Washington.","d":5.92,"est":false,"a":21.524},{"id":"L009","speaker":"N","text":"It starts on a Sunday, the eighth of November, with a statement from the board.","d":4.12,"est":false,"a":27.584},{"id":"L010","speaker":"N","text":"But first... why is this your problem?","d":2.22,"est":false,"a":32.844},{"id":"L011","speaker":"N","text":"The most popular kind of index fund in America holds five hundred companies. They are not equal slices. The bigger the company, the bigger its slice.","d":9.31,"est":false,"a":35.204},{"id":"L012","speaker":"N","text":"Before the drop, about seven dollars of every hundred in that fund was one company. This one.","d":5.57,"est":false,"a":44.654},{"id":"L013","speaker":"N","text":"The research firm Trefis checked one big S&P 500 fund as of the fourth of November: seven point three percent. A popular Nasdaq fund, about eight.","d":10.19,"est":false,"a":50.364},{"id":"L014","speaker":"N","text":"Keep that seven in mind.","d":1.52,"est":false,"a":60.694},{"id":"L015","speaker":"MARTHA","text":"I picked the boring fund on purpose.","d":1.84,"est":false,"a":62.394},{"id":"L016","speaker":"CHAD","text":"Boring fund. Spicy chip.","d":1.4,"est":false,"a":64.374},{"id":"L017","speaker":"N","text":"The arithmetic is simple. When Nvidia moves ten percent, the whole index moves about seven tenths of one percent... with every other company standing still.","d":9.47,"est":false,"a":65.954},{"id":"L018","speaker":"N","text":"So do the sum. If you had a hundred thousand dollars in that fund, Nvidia's two-day fall alone took more than six hundred dollars off it. The rest of the market rose on Monday, and hid it.","d":10.83,"est":false,"a":75.564},{"id":"L019","speaker":"N","text":"You didn't pick the stock. You didn't read the headline. You were just standing under the tent.","d":4.63,"est":false,"a":86.534},{"id":"L020","speaker":"BENNY","text":"What's holding this thing up?","d":1.35,"est":false,"a":91.344},{"id":"L021","speaker":"HAL","text":"Don't look up.","d":1.16,"est":false,"a":92.834},{"id":"L022","speaker":"N","text":"He looks up.","d":0.79,"est":false,"a":94.174},{"id":"L023","speaker":"N","text":"It's one pole.","d":0.96,"est":false,"a":96.104},{"id":"L024","speaker":"N","text":"Nvidia was founded in 1993. Its chief executive, Jensen Huang, has run it ever since. Thirty-three years, one boss.","d":8.88,"est":false,"a":97.204},{"id":"L025","speaker":"N","text":"The company grew from a start-up into one of the most valuable businesses on earth. The pole never changed.","d":6.22,"est":false,"a":106.224},{"id":"L026","speaker":"N","text":"The company knew it. Years ago, its own annual report warned that losing its key people, and it named him, would harm the business.","d":7.93,"est":false,"a":112.584},{"id":"L027","speaker":"N","text":"And it said it carried no insurance on him.","d":2.19,"est":false,"a":120.654},{"id":"L028","speaker":"HAL","text":"I'd like to insure one pole.","d":2.12,"est":false,"a":123.024},{"id":"L029","speaker":"REGGIE","text":"How many poles do you have?","d":2.24,"est":false,"a":125.284},{"id":"L030","speaker":"HAL","text":"One.","d":0.74,"est":false,"a":127.664},{"id":"L031","speaker":"REGGIE","text":"Next.","d":0.91,"est":false,"a":128.544},{"id":"L032","speaker":"N","text":"So who takes over if he goes? Publicly, nobody has been named.","d":3.86,"est":false,"a":129.634},{"id":"L033","speaker":"N","text":"One Wall Street analyst, Dan Ives of Yorkville Ives, put it bluntly. He said there is no succession plan.","d":6.82,"est":false,"a":133.634},{"id":"L034","speaker":"N","text":"In a note to clients, he used two more words about the chief executive. Not replaceable.","d":5.45,"est":false,"a":140.594},{"id":"L035","speaker":"N","text":"And the pole has a second job. When Washington talks about banning chip sales to China, he is the one who shows up to argue against it.","d":7.8,"est":false,"a":146.184},{"id":"L036","speaker":"REGGIE","text":"Who speaks for the chip business?","d":2.37,"est":false,"a":154.164},{"id":"L037","speaker":"CHAD","text":"Him.","d":0.45,"est":false,"a":156.674},{"id":"L038","speaker":"REGGIE","text":"And if he can't?","d":1.69,"est":false,"a":157.264},{"id":"L039","speaker":"CHAD","text":"...Also him.","d":0.789,"est":false,"a":159.094},{"id":"L040","speaker":"N","text":"One man. Two jobs. Now meet the customer.","d":2.74,"est":false,"a":160.063},{"id":"L041","speaker":"N","text":"Because this story did not start with a board. It started with a buyer.","d":3.9,"est":false,"a":163.943},{"id":"L042","speaker":"N","text":"Megaspeed is a company based in Singapore. According to news reports, it was spun out of a Chinese firm, and it has bought billions of dollars of Nvidia's chips.","d":10.41,"est":false,"a":167.983},{"id":"L043","speaker":"N","text":"Here is why that matters. American rules stop Nvidia from selling its most advanced chips to China.","d":6.2,"est":false,"a":178.533},{"id":"L044","speaker":"N","text":"But what about renting them?","d":1.36,"est":false,"a":184.873},{"id":"L045","speaker":"N","text":"Think of an oven you're not allowed to ship abroad. Fine. The oven stays put. But can a customer far away rent the kitchen... and cook over the phone?","d":8.65,"est":false,"a":186.373},{"id":"L046","speaker":"REGGIE","text":"Did the oven leave the country?","d":2.7,"est":false,"a":195.203},{"id":"L047","speaker":"CHAD","text":"No, sir.","d":0.62,"est":false,"a":198.043},{"id":"L048","speaker":"REGGIE","text":"Did the dinner?","d":1.22,"est":false,"a":198.803},{"id":"L049","speaker":"CHAD","text":"...Define dinner.","d":0.855,"est":false,"a":200.163},{"id":"L050","speaker":"N","text":"That is the gap lawmakers are now arguing about: whether renting that computing power to users in China counts as an export at all.","d":8.46,"est":false,"a":201.198},{"id":"L051","speaker":"N","text":"And Singapore says it has no legal duty to enforce another country's export rules.","d":5.67,"est":false,"a":209.798},{"id":"L052","speaker":"N","text":"Reporters began asking about Megaspeed back in 2025. Nvidia's answer was steady. In the last days of October this year, its chief executive told Bloomberg those dealings were, quote, \"normal and not unusual.\"","d":14.47,"est":false,"a":215.608},{"id":"L053","speaker":"BENNY","text":"Anything unusual in there?","d":1.579,"est":false,"a":230.258},{"id":"L054","speaker":"HAL","text":"Nothing unusual.","d":1.72,"est":false,"a":231.977},{"id":"L055","speaker":"BENNY","text":"That's what the sign says.","d":1.3,"est":false,"a":233.837},{"id":"L056","speaker":"HAL","text":"I wrote the sign.","d":1.579,"est":false,"a":235.277},{"id":"L057","speaker":"N","text":"Days later, the story stopped being about a customer.","d":2.86,"est":false,"a":237.036},{"id":"L058","speaker":"N","text":"Sunday, the eighth of November.","d":1.62,"est":false,"a":241.036},{"id":"L059","speaker":"N","text":"Nvidia's board announces an independent investigation. Its reason, in its own words: reporting that its chief executive had been, quote, \"the target of a foreign intelligence effort.\"","d":11.44,"est":false,"a":242.796},{"id":"L060","speaker":"N","text":"Here is what is claimed, and by whom. News reports say American officials believe a former Megaspeed executive worked for Chinese intelligence. China denies it. The reports rest on unnamed people, and nothing has been proven in public.","d":15.17,"est":false,"a":254.376},{"id":"L061","speaker":"N","text":"The same day, the company publishes an email from the chief executive to staff. In it, he admits he was unfaithful to his wife, names nobody, and writes that he had, quote, \"fallen short.\"","d":11.84,"est":false,"a":269.686},{"id":"L062","speaker":"N","text":"The board adds one more line. It says it has no reason to believe that national security or company secrets were compromised.","d":7.83,"est":false,"a":281.666},{"id":"L063","speaker":"N","text":"The investigation is run by directors who don't work for him, with an outside law firm. At the time, the company said he planned to stay in the job while they look.","d":9.59,"est":false,"a":289.636},{"id":"L064","speaker":"BENNY","text":"Should I be reading this at midnight?","d":1.7,"est":false,"a":299.406},{"id":"L065","speaker":"MARTHA","text":"No.","d":0.48,"est":false,"a":301.246},{"id":"L066","speaker":"BENNY","text":"...I'm reading it.","d":0.92,"est":false,"a":301.866},{"id":"L067","speaker":"N","text":"Monday. The opening bell. By the close, the shares are down a little more than four percent.","d":5.23,"est":false,"a":302.966},{"id":"L068","speaker":"N","text":"That same day, a shareholder files a lawsuit. It says calling those dealings normal was misleading, and that investors were kept in the dark. Those claims have not been tested in court.","d":11.15,"est":false,"a":308.336},{"id":"L069","speaker":"N","text":"Tuesday. Down again. Almost five and a half percent.","d":3.22,"est":false,"a":319.626},{"id":"L070","speaker":"N","text":"To be fair, Tuesday had a second problem. Inflation came in hot that morning, and the whole market slipped.","d":6.3,"est":false,"a":322.986},{"id":"L071","speaker":"CHAD","text":"Is it the boss or is it inflation?","d":1.69,"est":false,"a":329.466},{"id":"L072","speaker":"HAL","text":"Yes.","d":0.8,"est":false,"a":331.296},{"id":"L073","speaker":"N","text":"Two days. About nine and a half percent.","d":2.19,"est":false,"a":332.276},{"id":"L074","speaker":"N","text":"But an investigation doesn't change how many chips you sell. So what, exactly, were investors selling?","d":6.06,"est":false,"a":334.606},{"id":"L075","speaker":"N","text":"They were selling two fears.","d":1.44,"est":false,"a":341.806},{"id":"L076","speaker":"N","text":"Fear one. The pole leaves.","d":1.54,"est":false,"a":343.386},{"id":"L077","speaker":"N","text":"Dan Ives, the same analyst, wrote that the company would be worth twenty-five to thirty percent less if the chief executive were removed. That's a forecast, not a fact.","d":10.5,"est":false,"a":345.066},{"id":"L078","speaker":"N","text":"Put his what-if into your hundred thousand dollars from earlier.","d":3.29,"est":false,"a":355.706},{"id":"L079","speaker":"N","text":"Up to about two thousand dollars, from one company.","d":3.14,"est":false,"a":359.136},{"id":"L080","speaker":"N","text":"That's our arithmetic on his what-if, not a prediction.","d":2.96,"est":false,"a":362.416},{"id":"L081","speaker":"N","text":"On Wednesday, the firm Baird cut its rating on the stock, and cut its price target from five hundred dollars to two hundred. One reason it gave: it can't tell whether he keeps the job.","d":11.1,"est":false,"a":365.516},{"id":"L082","speaker":"BENNY","text":"What's your price target?","d":1.19,"est":false,"a":376.796},{"id":"L083","speaker":"HAL","text":"Depends.","d":1.01,"est":false,"a":378.126},{"id":"L084","speaker":"BENNY","text":"On what?","d":0.7,"est":false,"a":379.276},{"id":"L085","speaker":"HAL","text":"On one guy's calendar.","d":2.07,"est":false,"a":380.116},{"id":"L086","speaker":"N","text":"Fear two. The argument is lost.","d":2.08,"est":false,"a":382.366},{"id":"L087","speaker":"N","text":"On Tuesday, the news site The Information reported that the former executive helped arrange about seven and a half billion dollars of Nvidia chip sales to Chinese companies.","d":11.201,"est":false,"a":384.586},{"id":"L088","speaker":"N","text":"Megaspeed denies any illegal chip transfers. And no investigation has published a finding.","d":5.89,"est":false,"a":395.927},{"id":"L089","speaker":"N","text":"Washington moved anyway. Remember the kitchen? Lawmakers are pushing three China chip bills into this year's defense bill, and some have asked the chief executive to come and explain.","d":11.06,"est":false,"a":401.957},{"id":"L090","speaker":"N","text":"One senator, Michael Bennet, pressed the administration on why it had not stopped Megaspeed already.","d":5.88,"est":false,"a":413.157},{"id":"L091","speaker":"CHAD","text":"He used to walk in here and win.","d":1.41,"est":false,"a":419.217},{"id":"L092","speaker":"REGGIE","text":"He used to walk in here.","d":2.29,"est":false,"a":420.767},{"id":"L093","speaker":"N","text":"So that is the trade. If he goes, the company loses its builder. If he stays, it may lose its best argument. Either way, the price had to move.","d":8.99,"est":false,"a":423.237},{"id":"L094","speaker":"N","text":"But how big is big, for a boss in trouble?","d":2.39,"est":false,"a":432.367},{"id":"L095","speaker":"N","text":"Other tents have shaken before.","d":1.78,"est":false,"a":435.897},{"id":"L096","speaker":"N","text":"Three companies. Three bosses. Three very different days.","d":3.31,"est":false,"a":437.817},{"id":"L097","speaker":"N","text":"August 2011. Steve Jobs resigned as Apple's chief executive. His successor, Tim Cook, had already been running the company day to day.","d":9.27,"est":false,"a":441.267},{"id":"L098","speaker":"N","text":"The next day, Apple's shares closed down less than one percent.","d":3.48,"est":false,"a":450.677},{"id":"L099","speaker":"N","text":"The market as a whole fell more, about one and a half percent.","d":3.32,"est":false,"a":454.297},{"id":"L100","speaker":"N","text":"May 2025. Warren Buffett told shareholders he would step down as Berkshire Hathaway's chief executive at the end of the year.","d":8.34,"est":false,"a":457.757},{"id":"L101","speaker":"N","text":"His heir, Greg Abel, had been named years before. And Buffett would stay on as chairman.","d":5.2,"est":false,"a":466.237},{"id":"L102","speaker":"N","text":"The next trading day, the shares still fell about five percent. About fifty-nine billion dollars of value, gone.","d":6.67,"est":false,"a":471.577},{"id":"L103","speaker":"CHAD","text":"They had a spare pole for years!","d":1.49,"est":false,"a":478.427},{"id":"L104","speaker":"HAL","text":"Still cost five percent to swap it.","d":2.52,"est":false,"a":480.057},{"id":"L105","speaker":"N","text":"September 2018. America's market regulator, the SEC, sued Elon Musk, Tesla's chief executive.","d":7.29,"est":false,"a":482.757},{"id":"L106","speaker":"N","text":"It accused him of securities fraud over tweets about taking Tesla private, and asked to bar him from running a public company.","d":7.55,"est":false,"a":490.187},{"id":"L107","speaker":"N","text":"The company wasn't the defendant. He was.","d":2.37,"est":false,"a":497.877},{"id":"L108","speaker":"N","text":"The next day, Tesla's shares fell nearly fourteen percent.","d":3.14,"est":false,"a":500.387},{"id":"L109","speaker":"N","text":"He had called the case unjustified, and settled the day after without admitting or denying it.","d":5.68,"est":false,"a":503.667},{"id":"L110","speaker":"N","text":"Line them up. Apple had an heir ready, and lost less than one percent. Berkshire had one too, and still lost five percent. Tesla's danger was to the man himself, and it lost almost fourteen.","d":11.54,"est":false,"a":509.487},{"id":"L111","speaker":"N","text":"Nvidia's two days, about nine and a half percent, sit between Berkshire and Tesla.","d":5.04,"est":false,"a":521.167},{"id":"L112","speaker":"N","text":"Nvidia has no heir named in public. And this review is about its boss, not about its chips.","d":5.94,"est":false,"a":526.347},{"id":"L113","speaker":"N","text":"That's a comparison of size, not a forecast.","d":2.67,"est":false,"a":532.427},{"id":"L114","speaker":"N","text":"And then, on Wednesday, it went up.","d":1.82,"est":false,"a":535.237},{"id":"L115","speaker":"N","text":"Wednesday, the eleventh.","d":1.31,"est":false,"a":538.197},{"id":"L116","speaker":"N","text":"A company called CoreWeave, which rents out Nvidia chips, had reported strong results the evening before. Chip stocks jumped, and Nvidia jumped with them.","d":9.82,"est":false,"a":539.647},{"id":"L117","speaker":"CHAD","text":"We're back!","d":0.619,"est":false,"a":549.647},{"id":"L118","speaker":"HAL","text":"We're Wednesday.","d":1.37,"est":false,"a":550.406},{"id":"L119","speaker":"N","text":"By the closing bell, nothing about the investigation had changed. What Wednesday's trading showed is that the demand had not changed either.","d":8.46,"est":false,"a":551.956},{"id":"L120","speaker":"N","text":"Nvidia's own forecast for this quarter is about one hundred and eight billion dollars in sales. It has announced no change to that number.","d":8.54,"est":false,"a":560.556},{"id":"L121","speaker":"N","text":"By the close, your seven dollars got a little of itself back. Not all.","d":3.91,"est":false,"a":569.236},{"id":"L122","speaker":"N","text":"And here is the part almost nobody noticed.","d":2.7,"est":false,"a":573.286},{"id":"L123","speaker":"N","text":"That forecast assumes no data center chip sales to China. None.","d":3.98,"est":false,"a":576.126},{"id":"L124","speaker":"N","text":"So the fight in Washington is over money that isn't in the number. The risk is not this quarter. It's the rules for the quarters after it.","d":7.49,"est":false,"a":580.246},{"id":"L125","speaker":"N","text":"If the kitchen door gets locked, the buyers who rent that kitchen need fewer ovens. That is the sale investors can't see yet.","d":7.3,"est":false,"a":587.876},{"id":"L126","speaker":"MARTHA","text":"So the business is fine.","d":1.3,"est":false,"a":595.356},{"id":"L127","speaker":"BENNY","text":"The business is fine.","d":1.3,"est":false,"a":596.796},{"id":"L128","speaker":"MARTHA","text":"Then why did it cost me six hundred dollars?","d":2.27,"est":false,"a":598.236},{"id":"L129","speaker":"BENNY","text":"...Look up.","d":0.72,"est":false,"a":600.646},{"id":"L130","speaker":"N","text":"Then the closing bell rang. And Wednesday wasn't over.","d":2.95,"est":false,"a":601.546},{"id":"L131","speaker":"N","text":"After the close, the bounce ran out.","d":1.87,"est":false,"a":605.636},{"id":"L132","speaker":"N","text":"Two newspapers published reports. Both rest on people they did not name.","d":4.47,"est":false,"a":607.646},{"id":"L133","speaker":"N","text":"The New York Times reported a second relationship, which the company has not commented on.","d":5.19,"est":false,"a":612.256},{"id":"L134","speaker":"N","text":"And The Wall Street Journal reported that Nvidia's board is preparing to remove its chief executive.","d":5.95,"est":false,"a":617.586},{"id":"L135","speaker":"N","text":"Nvidia did not immediately respond to requests for comment on that report.","d":4.82,"est":false,"a":623.676},{"id":"L136","speaker":"N","text":"As of Wednesday night, the board had made no new public statement.","d":3.46,"est":false,"a":628.636},{"id":"L137","speaker":"N","text":"In after-hours trading, before Thursday's open, the shares fell more than eight percent.","d":5.1,"est":false,"a":632.236},{"id":"L138","speaker":"N","text":"That wiped out Wednesday's gain, and more.","d":2.17,"est":false,"a":637.476},{"id":"L139","speaker":"N","text":"Remember the seven dollars? On a hundred thousand dollars in that fund, that's roughly another five or six hundred dollars from Nvidia's slice... if it holds.","d":9.44,"est":false,"a":639.786},{"id":"L140","speaker":"N","text":"It's a snapshot, not a close. And that's our arithmetic, not a forecast.","d":3.98,"est":false,"a":649.366},{"id":"L141","speaker":"BENNY","text":"You said, \"We're Wednesday.\"","d":1.27,"est":false,"a":653.526},{"id":"L142","speaker":"HAL","text":"It's still Wednesday.","d":1.665,"est":false,"a":654.936},{"id":"L143","speaker":"N","text":"So is it over?","d":1.06,"est":false,"a":656.781},{"id":"L144","speaker":"N","text":"Not yet.","d":0.79,"est":false,"a":657.981},{"id":"L145","speaker":"N","text":"The price is waiting on three doors. Door one, the board's investigation, which has found nothing in public so far.","d":7.45,"est":false,"a":658.911},{"id":"L146","speaker":"N","text":"How does a review like this work?","d":1.82,"est":false,"a":666.501},{"id":"L147","speaker":"N","text":"A guide by two corporate lawyers, published on Harvard Law School's governance forum, lays out the usual shape.","d":6.77,"est":false,"a":668.461},{"id":"L148","speaker":"N","text":"The committee directs the review, not its lawyers. And the lawyers should answer to the committee alone, not to the company.","d":6.9,"est":false,"a":675.371},{"id":"L149","speaker":"N","text":"At the end, the committee reports its findings to the board. The guide doesn't say they must be published.","d":5.62,"est":false,"a":682.411},{"id":"L150","speaker":"N","text":"Nvidia's board gave no deadline.","d":2.12,"est":false,"a":688.171},{"id":"L151","speaker":"N","text":"But The Wall Street Journal reports the board could meet soon to decide his future.","d":4.84,"est":false,"a":690.431},{"id":"L152","speaker":"N","text":"No decision had been reported by Wednesday night.","d":2.97,"est":false,"a":695.411},{"id":"L153","speaker":"N","text":"Door two, Washington, where none of those bills is law so far.","d":3.94,"est":false,"a":698.521},{"id":"L154","speaker":"N","text":"Door three is a date. Tuesday, the seventeenth of November. After the closing bell, Nvidia is due to report its results, and whoever leads it then takes questions from the people who price the stock.","d":12.17,"est":false,"a":702.601},{"id":"L155","speaker":"N","text":"The next day, three House committee chairs want a closed-door briefing.","d":3.97,"est":false,"a":714.911},{"id":"L156","speaker":"CHAD","text":"What's the first question going to be?","d":1.69,"est":false,"a":719.061},{"id":"L157","speaker":"BENNY","text":"It won't be about chips.","d":1.27,"est":false,"a":720.891},{"id":"L158","speaker":"N","text":"The bar is already up. Analysts, on average, expect a little more than Nvidia's own forecast: nearly one hundred and nine billion dollars, according to a tally in The Motley Fool.","d":11.54,"est":false,"a":722.341},{"id":"L159","speaker":"N","text":"That's more than a billion dollars of sales a day.","d":2.82,"est":false,"a":734.021},{"id":"L160","speaker":"N","text":"Listen for three things that day. Does the forecast move? Does the board say anything new? And does anyone say the word China?","d":7.47,"est":false,"a":736.981},{"id":"L161","speaker":"N","text":"On the first one, a writer at The Motley Fool points to the forecast for the next quarter. A weak one, he argues, could be a sign that AI spending is slowing. That's an opinion, not a fact.","d":11.16,"est":false,"a":744.591},{"id":"L162","speaker":"N","text":"Whatever the board decides, one thing has already changed. Investors have now seen the empty chair. As of Wednesday night, neither report names anyone to fill it. A company this big does not get to leave it empty forever.","d":13.33,"est":false,"a":755.891},{"id":"L163","speaker":"N","text":"And you have seen your seven dollars. You own this story whether you follow it or not.","d":4.52,"est":false,"a":769.361},{"id":"L164","speaker":"BENNY","text":"Is one pole normal?","d":1.26,"est":false,"a":774.061},{"id":"L165","speaker":"HAL","text":"It's not unusual.","d":1.74,"est":false,"a":775.461},{"id":"L166","speaker":"N","text":"So why is Nvidia down over its CEO?","d":2.54,"est":false,"a":777.381},{"id":"L167","speaker":"N","text":"Not because anyone reported it selling one chip less. Because one man's trouble made everyone look up at the same time...","d":6.96,"est":false,"a":780.061},{"id":"L168","speaker":"N","text":"...and count the poles.","d":1.13,"est":false,"a":787.161}], 789.291);
