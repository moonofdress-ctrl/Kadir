spend one hundred dollars with a clothing seller on Amazon... and that seller keeps about ten.","d":5.42,"est":false,"a":0.2},{"id":"L002","speaker":"N","text":"Amazon keeps about fifty-two.","d":1.88,"est":false,"a":5.76},{"id":"L003","speaker":"N","text":"That's not sales tax.","d":1.36,"est":false,"a":7.78},{"id":"L004","speaker":"N","text":"It's not the card fee — a typical one is about three dollars twenty.","d":4.04,"est":false,"a":9.28},{"id":"L005","speaker":"N","text":"So how can Amazon keep fifty-two dollars of a hundred you spend?","d":4.02,"est":false,"a":13.46},{"id":"L006","speaker":"BENNY","text":"I paid a hundred!","d":1.07,"est":false,"a":17.66},{"id":"L007","speaker":"MARTHA","text":"You paid Amazon. The seller got the change.","d":2.54,"est":false,"a":18.87},{"id":"L008","speaker":"N","text":"Three bills on one sale. Fees. Fulfillment. Ads.","d":3.45,"est":false,"a":21.59},{"id":"L009","speaker":"N","text":"These numbers are one model of a typical clothing seller, built from Amazon's fee tables and Marketplace Pulse data.","d":6.89,"est":false,"a":25.18},{"id":"L010","speaker":"N","text":"Follow your hundred.","d":1.18,"est":false,"a":32.21},{"id":"L011","speaker":"N","text":"Stop one, the commission. On clothing over twenty dollars, seventeen percent. Seventeen dollars, gone before the box moves.","d":7.18,"est":false,"a":33.53},{"id":"L012","speaker":"N","text":"Stop two, fulfillment. Amazon's warehouse and delivery take about twenty more.","d":4.8,"est":false,"a":40.85},{"id":"L013","speaker":"N","text":"Stop three, ads. Being seen costs about fifteen.","d":3.08,"est":false,"a":45.79},{"id":"L014","speaker":"N","text":"Amazon's ads took in sixty-eight point six billion dollars in 2025. About one hundred eighty-eight million a day.","d":8.16,"est":false,"a":49.01},{"id":"L015","speaker":"N","text":"Seventeen, twenty, fifteen. About fifty-two — more than half of your hundred. Product costs and returns eat thirty-eight more.","d":7.45,"est":false,"a":57.31},{"id":"L016","speaker":"N","text":"Then the government opened a file.","d":1.79,"est":false,"a":64.9},{"id":"L017","speaker":"N","text":"All of that is on the price list. The next part is in court.","d":3.32,"est":false,"a":67.83},{"id":"L018","speaker":"N","text":"September 26th, 2023. The FTC sues Amazon in federal court in Washington State.","d":7.02,"est":false,"a":71.29},{"id":"L019","speaker":"N","text":"Its complaint alleges Amazon buries sellers who discount elsewhere until they're, quote, \"effectively invisible\"... making Amazon's price, quote, \"a price floor everywhere else.\"","d":10.73,"est":false,"a":78.45},{"id":"L020","speaker":"N","text":"The FTC also alleges a tool called Project Nessie made Amazon over one billion dollars in extra profit.","d":7.33,"est":false,"a":89.32},{"id":"L021","speaker":"BENNY","text":"So stamp it!","d":0.88,"est":false,"a":96.83},{"id":"L022","speaker":"REGGIE","text":"Not yet.","d":1.13,"est":false,"a":97.85},{"id":"L023","speaker":"BENNY","text":"When?","d":0.52,"est":false,"a":99.12},{"id":"L024","speaker":"REGGIE","text":"Forms. In triplicate.","d":2.21,"est":false,"a":99.78},{"id":"L025","speaker":"N","text":"Amazon says the FTC mischaracterizes the tool, and that it was scrapped.","d":4.59,"est":false,"a":102.17},{"id":"L026","speaker":"N","text":"It calls the case, quote, \"wrong on the facts and the law.\"","d":3.16,"est":false,"a":106.9},{"id":"L027","speaker":"N","text":"So is Amazon's cut illegal? No court has said so.","d":3.26,"est":false,"a":110.2},{"id":"L028","speaker":"N","text":"Why fifty-two? One company sells the shelf, the truck and the billboard.","d":4.09,"est":false,"a":113.6},{"id":"L029","speaker":"N","text":"Here's what almost nobody noticed.","d":1.97,"est":false,"a":117.83},{"id":"L030","speaker":"N","text":"In 2016, by Marketplace Pulse's count, that cut was about thirty-five dollars.","d":5.955,"est":false,"a":119.94},{"id":"L031","speaker":"N","text":"By 2022, about fifty-two.",
