ace":"shocked","enter":"none","acts":[{"cue":"L026","word":4,"face":"crying"}]}]},{"id":"c1s24","cue":"L027","set":"bottling_plant","opts":{"night":true},"place":"bottling plant","camera":"tilt_up","grade":"night","light":{"x":760,"y":220,"r":750,"color":"#ffe0a8","dark":0.5},"actors":[{"who":"ALLISON_ELLSWORTH","x":620,"y":960,"face":"happy","pose":"present","enter":"none","acts":[{"cue":"L027","word":5,"pose":"point"}]}],"props":[{"type":"bottles","x":1260,"y":940,"n":5}]},{"id":"c1s25","cue":"L027","word":10,"set":"pitch_stage","opts":{"view":"seats","night":true,"empty":true},"place":"audience seats","camera":"push_in","grade":"night","callback":"the pitch stage","light":{"x":960,"y":380,"r":750,"color":"#fff1c4","dark":0.5},"props":[{"type":"investor_chair","x":560,"y":700},{"type":"investor_chair","x":760,"y":680},{"type":"investor_chair","x":960,"y":670},{"type":"investor_chair","x":1160,"y":680},{"type":"investor_chair","x":1360,"y":700}]}]}, [{"id":"L001","speaker":"N","text":"2018. One spotlight on a television stage. Allison Ellsworth is pitching her vinegar soda to five investors... and she is nine months pregnant.","d":8.89,"est":true,"a":0.2},{"id":"L002","speaker":"N","text":"In the one lit chair: Rohan Oza. He is about to offer her four hundred thousand dollars.","d":6.597,"est":true,"a":9.23},{"id":"L003","speaker":"SODA","text":"Psst. Don't get too attached to me.","d":2.775,"est":true,"a":16.007},{"id":"L004","speaker":"N","text":"We know what they don't. One day, a cola giant will pay one point nine five billion dollars for this drink.","d":8.125,"est":true,"a":18.962},{"id":"L005","speaker":"BENNY","text":"Two billion dollars? For vinegar?","d":2.011,"est":true,"a":27.267},{"id":"L006","speaker":"SODA","text":"Same soda. Keep watching.","d":1.629,"est":true,"a":29.418},{"id":"L007","speaker":"BENNY","text":"Is she okay up there?","d":2.011,"est":true,"a":31.187},{"id":"L008","speaker":"SODA","text":"She's fine. I'm the one sweating.","d":2.393,"est":true,"a":33.338},{"id":"L009","speaker":"N","text":"Her son will be born ten days after this pitch.","d":3.922,"est":true,"a":35.911},{"id":"L010","speaker":"N","text":"And that big number has a part almost nobody noticed.","d":3.922,"est":true,"a":39.973},{"id":"L011","speaker":"N","text":"So how did Poppi make one point nine five billion dollars from soda?","d":5.068,"est":true,"a":44.035},{"id":"L012","speaker":"N","text":"It starts around 2015, in a family kitchen. Allison has stomach troubles. So she mixes apple cider vinegar, fruit and soda water.","d":8.508,"est":true,"a":49.243},{"id":"L013","speaker":"N","text":"Her husband, Stephen, helps sell it at farmers' markets in Dallas. Within months, a Whole Foods buyer agrees to stock it.","d":8.125,"est":true,"a":57.891},{"id":"L014","speaker":"MARTHA","text":"Vinegar. In a soda.","d":1.629,"est":true,"a":66.196},{"id":"L015","speaker":"SODA","text":"With fruit!","d":0.864,"est":true,"a":67.965},{"id":"L016","speaker":"MARTHA","text":"Who drinks vinegar on purpose?","d":2.011,"est":true,"a":68.969},{"id":"L017","speaker":"SODA","text":"People with stomachs?","d":1.246,"est":true,"a":71.12},{"id":"L018","speaker":"MARTHA","text":"...Fine. You're in.","d":1.246,"est":true,"a":72.506},{"id":"L019","speaker":"N","text":"The first eighteen months bring in about five hundred thousand dollars of sales. Growing costs far more.","d":6.597,"est":true,"a":73.932},{"id":"L020","speaker":"N","text":"Allison later told the Wall Street Journal, as Fortune reported: \"So we maxed out our credit cards, sold one of our cars to buy bottles\"...","d":9.654,"est":true,"a":80.669},{"id":"L021","speaker":"N","text":"...and opened their own factory. Her husband, she said, told her she was \"absolutely crazy\".","d":5.832,"est":true,"a":90.463},{"id":"L022","speaker":"HAL","text":"Credit cards. A car. A factory.","d":2.393,"est":true,"a":96.475},{"id":"L023","speaker":"SODA","text":"Is that a lot?","d":1.629,"est":true,"a":99.008},{"id":"L024","speaker":"HAL","text":"For a family? That's everything.","d":2.011,"est":true,"a":100.777},{"id":"L025","speaker":"SODA","text":"And if I don't sell?","d":2.011,"est":true,"a":102.928},{"id":"L026","speaker":"HAL","text":"Then you're very expensive salad dressing.","d":2.393,"est":true,"a":105.079},{"id":"L027","speaker":"N","text":"Then they practised one pitch for six months... for a stage with five investors on it.","d":6.215,"est":true,"a":107.652},{"id":"L028","speaker":"N","text":"Six months of practice. Then the lights came on.","d":3.539,"est":true,"a":114.007},{"id":"L029","speaker":"N","text":"The ask: four hundred thousand dollars for ten percent of the company. That puts the whole thing at four million.","d":7.743,"est":true,"a":117.686},{"id":"L030","speaker":"N","text":"Accounts of the episode say the investors pushed hard. One worried how much more money it would need. One disliked the valuation. Others objected to the plan to run their own factory.","d":12.329,"est":true,"a":125.569},{"id":"L031","speaker":"SODA","text":"No. No. No. No...","d":1.629,"est":true,"a":138.078},{"id":"L032","speaker":"BENNY","text":"That's four.","d":0.864,"est":true,"a":139.847},{"id":"L033","speaker":"SODA","text":"...Anyone? Anyone at all?","d":1.629,"est":true,"a":140.851},{"id":"L034","speaker":"N","text":"The fifth chair was Rohan Oza's. Four hundred thousand dollars... for twenty-five percent.","d":5.068,"est":true,"a":142.66},{"id":"L035","speaker":"N","text":"Same money, two and a half times the share. By our arithmetic, his offer valued the company at one point six million dollars, not four.","d":9.654,"est":true,"a":147.868},{"id":"L036","speaker":"CHAD","text":"Four million, bro. Ten percent.","d":2.011,"est":true,"a":157.702},{"id":"L037","speaker":"HAL","text":"One point six. A quarter.","d":2.011,"est":true,"a":159.853},{"id":"L038","speaker":"CHAD","text":"That's robbery!","d":0.864,"est":true,"a":162.004},{"id":"L039","speaker":"HAL","text":"That's a deal.","d":1.246,"est":true,"a":163.008},{"id":"L040","speaker":"SODA","text":"...I'll take it.","d":1.246,"est":true,"a":164.394},{"id":"L041","speaker":"N","text":"She took it. She remembers thinking, \"this moment right here could change my life.\"","d":5.45,"est":true,"a":165.82},{"id":"L042","speaker":"N","text":"Ten days after the pitch, her son was born.","d":3.539,"est":true,"a":171.41},{"id":"L043","speaker":"MARTHA","text":"Visiting hours are over.","d":1.629,"est":true,"a":175.129},{"id":"L044","speaker":"SODA","text":"I'm family. Sort of.","d":1.629,"est":true,"a":176.898},{"id":"L045","speaker":"MARTHA","text":"You're a beverage.","d":1.246,"est":true,"a":178.667},{"id":"L046","speaker":"N","text":"The episode aired on Sunday the ninth of December, 2018.","d":3.922,"est":true,"a":180.093},{"id":"L047","speaker":"MARTHA","text":"Twenty-five percent of a vinegar company.","d":2.393,"est":true,"a":184.195},{"id":"L048","speaker":"BENNY","text":"Is that good?","d":1.246,"est":true,"a":186.728},{"id":"L049","speaker":"MARTHA","text":"Depends what the other seventy-five turns into.","d":2.775,"est":true,"a":188.114},{"id":"L050","speaker":"BENNY","text":"When do we find out?","d":2.011,"est":true,"a":191.029},{"id":"L051","speaker":"MARTHA","text":"Ask me in six years.","d":2.011,"est":true,"a":193.18},{"id":"L052","speaker":"N","text":"Years later, Oza recalled what he had seen in that pitch.","d":4.304,"est":true,"a":195.371},{"id":"L053","speaker":"N","text":"\"Package, wrong. Brand, wrong. Everything is wrong, basically. But this liquid, that's it.\"","d":5.068,"est":true,"a":199.815},{"id":"L054","speaker":"CHAD","text":"Label, wrong. Bottle, wrong.","d":1.629,"est":true,"a":205.063},{"id":"L055","speaker":"SODA","text":"And me?","d":0.864,"est":true,"a":206.832},{"id":"L056","speaker":"CHAD","text":"You, I keep.","d":1.246,"est":true,"a":207.836},{"id":"L057","speaker":"N","text":"He had bought the drink. Now he wanted a new word on it.","d":5.068,"est":true,"a":209.262},{"id":"L058","speaker":"N","text":"The first thing to go was the name.","d":3.157,"est":true,"a":214.47},{"id":"L059","speaker":"N","text":"According to Mashed, \"Mother\" could not be trademarked.","d":3.157,"est":true,"a":217.767},{"id":"L060","speaker":"SODA","text":"I'd like to own my name, please.","d":2.775,"est":true,"a":221.104},{"id":"L061","speaker":"REGGIE","text":"Not that one.","d":1.246,"est":true,"a":224.019},{"id":"L062","speaker":"SODA","text":"...What about my face?","d":1.629,"est":true,"a":225.405},{"id":"L063","speaker":"REGGIE","text":"Next.","d":0.482,"est":true,"a":227.174},{"id":"L064","speaker":"N","text":"Later, Oza put it more politely: \"The name and package were not conducive of the big picture that we're trying to solve.\"","d":8.508,"est":true,"a":227.836},{"id":"L065","speaker":"N","text":"So in 2020 the bottle became a can. The name became Poppi. The label said \"prebiotic soda\".","d":6.597,"est":true,"a":236.484},{"id":"L066","speaker":"SODA","text":"Same soda. New word.","d":1.629,"est":true,"a":243.261},{"id":"L067","speaker":"BENNY","text":"You look... expensive.","d":1.246,"est":true,"a":245.03},{"id":"L068","speaker":"SODA","text":"I feel expensive.","d":1.246,"est":true,"a":246.416},{"id":"L069","speaker":"BENNY","text":"You taste the same.","d":1.629,"est":true,"a":247.802},{"id":"L070","speaker":"SODA","text":"Don't tell anyone.","d":1.246,"est":true,"a":249.571},{"id":"L071","speaker":"N","text":"Oza's firm, CAVU Consumer Partners, backed it. PepsiCo would later say CAVU funded Poppi from its first seed round.","d":7.361,"est":true,"a":250.997},{"id":"L072","speaker":"N","text":"The launch was set for March 2020... at a trade show that Covid cancelled.","d":5.45,"est":true,"a":258.498},{"id":"L073","speaker":"SODA","text":"Where is everybody?","d":1.246,"est":true,"a":264.128},{"id":"L074","speaker":"BENNY","text":"Home. Everybody's home.","d":1.246,"est":true,"a":265.514},{"id":"L075","speaker":"SODA","text":"Then I'm going to their homes.","d":2.393,"est":true,"a":266.9},{"id":"L076","speaker":"N","text":"So they sold online, through Amazon and online grocers. By the end of 2020, one report says, sales were about four million dollars.","d":8.89,"est":true,"a":269.473},{"id":"L077","speaker":"N","text":"Then came one video. Food Republic reports that a TikTok of Allison added a hundred thousand in sales within a day.","d":8.125,"est":true,"a":278.503},{"id":"L078","speaker":"CHAD","text":"Bro. The can is viral.","d":2.011,"est":true,"a":286.808},{"id":"L079","speaker":"SODA","text":"I'm a soda.","d":1.246,"est":true,"a":288.959},{"id":"L080","speaker":"CHAD","text":"Not anymore. Now you're content.","d":2.011,"est":true,"a":290.345},{"id":"L081","speaker":"SODA","text":"Is that better?","d":1.246,"est":true,"a":292.496},{"id":"L082","speaker":"CHAD","text":"It's louder.","d":0.864,"est":true,"a":293.882},{"id":"L083","speaker":"N","text":"But sales are not cash. Allison told Entrepreneur that at twenty million dollars of revenue, the company had seventy-five thousand dollars in the bank... and wasn't sure it could make payroll.","d":11.947,"est":true,"a":294.926},{"id":"L084","speaker":"N","text":"Stephen remembers \"begging and pleading\" with suppliers for more time to pay.","d":4.686,"est":true,"a":307.013},{"id":"L085","speaker":"HAL","text":"Pay Friday.","d":0.864,"est":true,"a":311.879},{"id":"L086","speaker":"SODA","text":"How about... a Friday?","d":1.629,"est":true,"a":312.883},{"id":"L087","speaker":"HAL","text":"Which one?","d":0.864,"est":true,"a":314.652},{"id":"L088","speaker":"N","text":"They needed money that didn't come from a credit card.","d":3.922,"est":true,"a":315.696},{"id":"L089","speaker":"N","text":"The money came... with famous faces attached.","d":2.775,"est":true,"a":319.758},{"id":"L090","speaker":"N","text":"In August 2021, Poppi raised thirteen million dollars, led by Oza's firm. Celebrities such as Halsey and Russell Westbrook joined in, Dallas Innovates reported.","d":9.272,"est":true,"a":322.673},{"id":"L091","speaker":"CHAD","text":"Can in hand. Chin up.","d":2.011,"est":true,"a":332.125},{"id":"L092","speaker":"SODA","text":"Does anyone actually drink me?","d":2.011,"est":true,"a":334.276},{"id":"L093","speaker":"CHAD","text":"Nobody sips, bro. They post.","d":2.011,"est":true,"a":336.427},{"id":"L094","speaker":"N","text":"The cans sold for two dollars forty-nine each, in more than seven thousand five hundred stores.","d":6.215,"est":true,"a":338.618},{"id":"L095","speaker":"BENNY","text":"Two forty-nine. For one can.","d":2.011,"est":true,"a":345.013},{"id":"L096","speaker":"MARTHA","text":"You're not buying a soda.","d":2.011,"est":true,"a":347.164},{"id":"L097","speaker":"BENNY","text":"Then what am I buying?","d":2.011,"est":true,"a":349.315},{"id":"L098","speaker":"MARTHA","text":"A picture of you holding it.","d":2.393,"est":true,"a":351.466},{"id":"L099","speaker":"BENNY","text":"...It is a nice picture.","d":2.011,"est":true,"a":353.999},{"id":"L100","speaker":"N","text":"In December 2022, another twenty-five million dollars. Sales had grown a hundred and forty-eight percent in a year.","d":6.979,"est":true,"a":356.19},{"id":"L101","speaker":"N","text":"By 2024, the company says, revenue was about five hundred million dollars. By our arithmetic, that's more than a hundred times 2020.","d":8.508,"est":true,"a":363.309},{"id":"L102","speaker":"CHAD","text":"Four million to five hundred million!","d":2.393,"est":true,"a":371.997},{"id":"L103","speaker":"HAL","text":"Sales. Not profit.","d":1.246,"est":true,"a":374.53},{"id":"L104","speaker":"CHAD","text":"Same thing!","d":0.864,"est":true,"a":375.916},{"id":"L105","speaker":"HAL","text":"It is not.","d":1.246,"est":true,"a":376.92},{"id":"L106","speaker":"N","text":"Then the biggest stage of all: the Super Bowl, on the ninth of February 2025. You may have seen the ad.","d":8.125,"est":true,"a":378.346},{"id":"L107","speaker":"BENNY","text":"What does a Super Bowl ad even cost?","d":3.157,"est":true,"a":386.651},{"id":"L108","speaker":"CHAD","text":"Doesn't matter. Everybody saw the can.","d":2.393,"est":true,"a":389.948},{"id":"L109","speaker":"BENNY","text":"I was looking at the snacks.","d":2.393,"est":true,"a":392.481},{"id":"L110","speaker":"N","text":"Before its ad, Poppi sent branded vending machines to thirty-two influencers.","d":4.304,"est":true,"a":395.054},{"id":"L111","speaker":"N","text":"A rival brand, Olipop, posted that each machine cost twenty-five thousand dollars. Keep that number in mind.","d":6.597,"est":true,"a":399.498},{"id":"L112","speaker":"CHAD","text":"Twenty-five grand for a fridge?","d":2.011,"est":true,"a":406.275},{"id":"L113","speaker":"SODA","text":"Less! Way less!","d":1.246,"est":true,"a":408.426},{"id":"L114","speaker":"CHAD","text":"How much less?","d":1.246,"est":true,"a":409.812},{"id":"L115","speaker":"SODA","text":"...Less.","d":0.482,"est":true,"a":411.198},{"id":"L116","speaker":"N","text":"A Poppi spokesperson called the figure \"not only fabricated but inflated by sixty percent\". Allison posted a TikTok blaming \"misinformation\" from \"one of our competitors\".","d":9.654,"est":true,"a":411.86},{"id":"L117","speaker":"N","text":"A fight about a fridge. But the fridge was not the point. And PepsiCo's own try was about to be reported dead.","d":8.508,"est":true,"a":421.654},{"id":"L118","speaker":"N","text":"Because PepsiCo had tried to build one.","d":2.775,"est":true,"a":430.302},{"id":"L119","speaker":"N","text":"Its own prebiotic soda was called Soulboost. In March 2025, days before the deal, Bloomberg reported it had been scrapped.","d":7.743,"est":true,"a":433.217},{"id":"L120","speaker":"GIANT","text":"Fiber. Fizz. Fruit. Perfect.","d":1.629,"est":true,"a":441.14},{"id":"L121","speaker":"HAL","text":"And the cool kids?","d":1.629,"est":true,"a":442.909},{"id":"L122","speaker":"GIANT","text":"They'll come.","d":0.864,"est":true,"a":444.678},{"id":"L123","speaker":"GIANT","text":"Build one?","d":0.864,"est":true,"a":445.682},{"id":"L124","speaker":"MARTHA","text":"Tried that.","d":0.864,"est":true,"a":446.686},{"id":"L125","speaker":"GIANT","text":"Borrow one?","d":0.864,"est":true,"a":447.69},{"id":"L126","speaker":"MARTHA","text":"Nobody lends you a can.","d":2.011,"est":true,"a":448.694},{"id":"L127","speaker":"GIANT","text":"Then... buy one.","d":1.246,"est":true,"a":450.845},{"id":"L128","speaker":"N","text":"Coca-Cola had launched its own, called Simply Pop. And Olipop, the brand behind the fridge post, was valued at one point eight five billion dollars in February 2025, according to CNBC.","d":11.947,"est":true,"a":452.271},{"id":"L129","speaker":"N","text":"Olipop's chief executive, Ben Goodwin, had said in 2023 that both PepsiCo and Coca-Cola had approached it about a sale.","d":7.743,"est":true,"a":464.358},{"id":"L130","speaker":"GIANT","text":"Will you be mine?","d":1.629,"est":true,"a":472.281},{"id":"L131","speaker":"SODA","text":"Me? I'm vinegar.","d":1.246,"est":true,"a":474.05},{"id":"L132","speaker":"GIANT","text":"You're popular vinegar.","d":1.246,"est":true,"a":475.436},{"id":"L133","speaker":"SODA","text":"How popular?","d":0.864,"est":true,"a":476.822},{"id":"L134","speaker":"GIANT","text":"Expensive popular.","d":0.864,"est":true,"a":477.826},{"id":"L135","speaker":"N","text":"PepsiCo's chief executive, Ramon Laguarta, would later say why it wanted one: consumers, he said, have a \"growing interest in health and wellness.\"","d":8.89,"est":true,"a":478.87},{"id":"L136","speaker":"BENNY","text":"Health... It used to say gut health?","d":2.775,"est":true,"a":487.94},{"id":"L137","speaker":"SODA","text":"Shh. Not in front of the lawyers.","d":2.775,"est":true,"a":490.855},{"id":"L138","speaker":"BENNY","text":"What lawyers?","d":0.864,"est":true,"a":493.77},{"id":"L139","speaker":"SODA","text":"...Those ones.","d":0.864,"est":true,"a":494.774},{"id":"L140","speaker":"N","text":"Health was the word everyone wanted. But on Poppi's can, that word was already in court.","d":6.215,"est":true,"a":495.818},{"id":"L141","speaker":"N","text":"In May 2024, a shopper filed a class action in federal court in California. Three more suits followed, all before the same judge.","d":8.89,"est":true,"a":502.173},{"id":"L142","speaker":"N","text":"According to the lawsuit, a can held about two grams of prebiotic fiber... so you'd need more than four cans a day for any effect, with the sugar that comes with them.","d":12.329,"est":true,"a":511.203},{"id":"L143","speaker":"REGGIE","text":"Two grams of fiber?","d":1.629,"est":true,"a":523.712},{"id":"L144","speaker":"SODA","text":"Allegedly.","d":0.482,"est":true,"a":525.481},{"id":"L145","speaker":"REGGIE","text":"Four cans a day?","d":1.629,"est":true,"a":526.103},{"id":"L146","speaker":"SODA","text":"Allegedly!","d":0.482,"est":true,"a":527.872},{"id":"L147","speaker":"N","text":"Poppi denied all of it. It says its label claims were true. It told Fortune a can has three grams of fiber and five grams of sugar.","d":10.418,"est":true,"a":528.534},{"id":"L148","speaker":"N","text":"In its own words, it had also removed \"any and all references to gut health\" from its labels in late 2023.","d":8.125,"est":true,"a":539.092},{"id":"L149","speaker":"SODA","text":"Same soda. Fewer words.","d":1.629,"est":true,"a":547.397},{"id":"L150","speaker":"MARTHA","text":"Funny. Tastes the same.","d":1.629,"est":true,"a":549.166},{"id":"L151","speaker":"SODA","text":"It is the same.","d":1.629,"est":true,"a":550.935},{"id":"L152","speaker":"MARTHA","text":"Then what were the words for?","d":2.393,"est":true,"a":552.704},{"id":"L153","speaker":"N","text":"On the fourth of December 2024, a day-long mediation. On the sixteenth, the judge paused the case: a deal in principle.","d":8.125,"est":true,"a":555.277},{"id":"L154","speaker":"REGGIE","text":"Your side?","d":0.864,"est":true,"a":563.582},{"id":"L155","speaker":"HAL","text":"Not guilty. But tired.","d":1.629,"est":true,"a":564.586},{"id":"L156","speaker":"REGGIE","text":"Their side?","d":0.864,"est":true,"a":566.355},{"id":"L157","speaker":"HAL","text":"Also tired.","d":0.864,"est":true,"a":567.359},{"id":"L158","speaker":"N","text":"Three months later, Bloomberg would report PepsiCo's Soulboost scrapped.","d":3.539,"est":true,"a":568.403},{"id":"L159","speaker":"N","text":"The settlement: eight point nine million dollars. Poppi admitted no fault.","d":4.304,"est":true,"a":572.082},{"id":"L160","speaker":"N","text":"Buyers could claim about nine dollars for a twelve-pack, and at least five dollars a household.","d":6.215,"est":true,"a":576.526},{"id":"L161","speaker":"MARTHA","text":"Nine dollars.","d":0.864,"est":true,"a":582.921},{"id":"L162","speaker":"BENNY","text":"For all that soda?","d":1.629,"est":true,"a":583.925},{"id":"L163","speaker":"MARTHA","text":"For a can that talked about your gut.","d":3.157,"est":true,"a":585.694},{"id":"L164","speaker":"BENNY","text":"Allegedly.","d":0.482,"est":true,"a":588.991},{"id":"L165","speaker":"MARTHA","text":"...Next time, read the can. Every word.","d":2.775,"est":true,"a":589.613},{"id":"L166","speaker":"N","text":"Now the timing. The settlement was dated the fifth of March 2025. It was filed in court on Friday the fourteenth. On Monday the seventeenth, the buyer spoke.","d":10.801,"est":true,"a":592.568},{"id":"L167","speaker":"CHAD","text":"Friday to Monday?","d":1.246,"est":true,"a":603.549},{"id":"L168","speaker":"HAL","text":"Tidy.","d":0.482,"est":true,"a":604.935},{"id":"L169","speaker":"CHAD","text":"Is that normal?","d":1.246,"est":true,"a":605.557},{"id":"L170","speaker":"HAL","text":"It's tidy.","d":0.864,"est":true,"a":606.943},{"id":"L171","speaker":"N","text":"The lawsuit was settled on paper. The buyer could finally say its number.","d":5.068,"est":true,"a":607.987},{"id":"L172","speaker":"N","text":"Monday, the seventeenth of March 2025. PepsiCo announced it would buy Poppi.","d":4.686,"est":true,"a":613.195},{"id":"L173","speaker":"GIANT","text":"Sign here. And here. And here.","d":2.393,"est":true,"a":618.061},{"id":"L174","speaker":"SODA","text":"What am I signing?","d":1.629,"est":true,"a":620.594},{"id":"L175","speaker":"GIANT","text":"Yourself.","d":0.482,"est":true,"a":622.363},{"id":"L176","speaker":"N","text":"The price: one point nine five billion dollars. By our arithmetic, that's four thousand eight hundred and seventy-five times what Oza offered on that stage.","d":9.654,"est":true,"a":623.025},{"id":"L177","speaker":"BENNY","text":"That's a lot of briefcases.","d":2.011,"est":true,"a":632.859},{"id":"L178","speaker":"SODA","text":"Same soda. Bigger number.","d":1.629,"est":true,"a":635.01},{"id":"L179","speaker":"BENNY","text":"How many are there?","d":1.629,"est":true,"a":636.779},{"id":"L180","speaker":"SODA","text":"Don't count. Just look up.","d":2.011,"est":true,"a":638.548},{"id":"L181","speaker":"N","text":"But read the press release. That figure includes three hundred million dollars of \"anticipated cash tax benefits\".","d":6.597,"est":true,"a":640.739},{"id":"L182","speaker":"N","text":"Of every hundred dollars in the headline, about fifteen is that tax benefit. PepsiCo calls the rest, one point six five billion, the net purchase price.","d":10.036,"est":true,"a":647.476},{"id":"L183","speaker":"CHAD","text":"So it's not two billion?","d":2.011,"est":true,"a":657.692},{"id":"L184","speaker":"HAL","text":"The headline is.","d":1.246,"est":true,"a":659.843},{"id":"L185","speaker":"CHAD","text":"And the rest?","d":1.246,"est":true,"a":661.229},{"id":"L186","speaker":"HAL","text":"The rest is a promise.","d":2.011,"est":true,"a":662.615},{"id":"L187","speaker":"N","text":"On top, PepsiCo offered an earnout: more money later, if Poppi hit targets. The release gave no amount.","d":6.979,"est":true,"a":664.806},{"id":"L188","speaker":"N","text":"The deal closed on the nineteenth of May 2025.","d":3.539,"est":true,"a":671.925},{"id":"L189","speaker":"N","text":"How much went to the Ellsworths? Nobody has published the split. Fortune reported more than a hundred million dollars. No filing shows it.","d":8.89,"est":true,"a":675.604},{"id":"L190","speaker":"MARTHA","text":"Over a hundred million?","d":1.629,"est":true,"a":684.674},{"id":"L191","speaker":"HAL","text":"Reported.","d":0.482,"est":true,"a":686.443},{"id":"L192","speaker":"MARTHA","text":"I can't pay a bill with \"reported\".","d":2.775,"est":true,"a":687.065},{"id":"L193","speaker":"N","text":"Allison told Fortune that selling had been the plan \"from day one\". And with PepsiCo, she said, \"Now we have a Ferrari underneath us for distribution.\"","d":10.036,"est":true,"a":690.02},{"id":"L194","speaker":"SODA","text":"Faster!","d":0.482,"est":true,"a":700.236},{"id":"L195","speaker":"GIANT","text":"Hold on to your label.","d":2.011,"est":true,"a":700.858},{"id":"L196","speaker":"SODA","text":"Which one?","d":0.864,"est":true,"a":703.009},{"id":"L197","speaker":"N","text":"But one piece of that price was never cash. It was a promise.","d":5.068,"est":true,"a":704.053},{"id":"L198","speaker":"N","text":"Here is the part almost nobody noticed.","d":2.775,"est":true,"a":709.261},{"id":"L199","speaker":"N","text":"According to Bloomberg, that earnout could reach three hundred million dollars, for targets due by the third quarter of 2027.","d":7.743,"est":true,"a":712.176},{"id":"L200","speaker":"N","text":"In December 2025, PepsiCo valued it at two hundred and seventy-eight million. By June 2026, a hundred and seventeen million. As of the fifth of September 2026, a filing said about twelve million.","d":12.711,"est":true,"a":720.059},{"id":"L201","speaker":"SODA","text":"Is that... my bonus?","d":1.629,"est":true,"a":732.95},{"id":"L202","speaker":"HAL","text":"What's left of it.","d":1.629,"est":true,"a":734.719},{"id":"L203","speaker":"SODA","text":"It could have been three hundred million!","d":2.775,"est":true,"a":736.488},{"id":"L204","speaker":"HAL","text":"Could have.","d":0.864,"est":true,"a":739.403},{"id":"L205","speaker":"N","text":"By our arithmetic, of every hundred dollars PepsiCo once expected to pay, it now expects about four. Bloomberg reported the cut in October 2026.","d":9.272,"est":true,"a":740.447},{"id":"L206","speaker":"N","text":"Ken Shea of Bloomberg Intelligence said that at this rate, it \"seems plausible\" PepsiCo may not pay any of it. PepsiCo said Poppi grew its sales volume by double digits in the third quarter and gained share.","d":14.24,"est":true,"a":749.859},{"id":"L207","speaker":"GIANT","text":"Sales are up!","d":1.246,"est":true,"a":764.279},{"id":"L208","speaker":"MARTHA","text":"Then why is the bonus down?","d":2.393,"est":true,"a":765.665},{"id":"L209","speaker":"GIANT","text":"Volume is up!","d":1.246,"est":true,"a":768.198},{"id":"L210","speaker":"MARTHA","text":"That's not what I asked.","d":2.011,"est":true,"a":769.584},{"id":"L211","speaker":"GIANT","text":"...Next question.","d":0.864,"est":true,"a":771.735},{"id":"L212","speaker":"N","text":"So where does this touch you? In your fridge. The class action covered cans bought from late January 2020, and its claim deadline closed on the twenty-sixth of September 2025.","d":11.565,"est":true,"a":772.779},{"id":"L213","speaker":"BENNY","text":"This one just says soda.","d":2.011,"est":true,"a":784.524},{"id":"L214","speaker":"SODA","text":"Read the small print.","d":1.629,"est":true,"a":786.675},{"id":"L215","speaker":"BENNY","text":"It says... soda.","d":1.246,"est":true,"a":788.444},{"id":"L216","speaker":"N","text":"And next time you stand in the soda aisle, read the word on the can. Somebody paid a lot of money for it.","d":8.89,"est":true,"a":789.87},{"id":"L217","speaker":"N","text":"The founders started again. On the ninth of November 2026, they launched a new drink, Jetty, at two forty-nine a bottle, paid for with two and a half million dollars of their own.","d":12.711,"est":true,"a":798.9},{"id":"L218","speaker":"N","text":"Allison told Modern Retail: \"No one is excited to see me win again.\"","d":5.068,"est":true,"a":811.751},{"id":"L219","speaker":"BENNY","text":"New bottle. New word.","d":1.629,"est":true,"a":816.999},{"id":"L220","speaker":"SODA","text":"Same founders.","d":0.864,"est":true,"a":818.768},{"id":"L221","speaker":"N","text":"The next date to watch: PepsiCo's next quarterly filing, when the value of that bonus can change again.","d":6.979,"est":true,"a":819.812},{"id":"L222","speaker":"SODA","text":"Same soda.","d":0.864,"est":true,"a":826.971},{"id":"L223","speaker":"BENNY","text":"Different word.","d":0.864,"est":true,"a":827.975},{"id":"L224","speaker":"N","text":"So how did Poppi make one point nine five billion dollars from soda? It changed the word on the can, not the soda... and the number was never quite that big.","d":11.947,"est":true,"a":829.019}], 841.966);
