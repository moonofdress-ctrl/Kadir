    <div id="root" data-composition-id="main" data-start="0" data-duration="876.23" data-width="1920" data-height="1080">

    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      Studio.build(tl, {"episode":"slug","title":"","viewer":"BENNY","notes":"See studio/README.md for the format and studio/gallery/storyboard.json for a working example of every component. Every shot is a small joke: a place, somebody doing something, a fact written in the scene, a living thing for each company or institution (FORMAT_BOOK 11).","shots":[{"id":"s01","cue":"L001","set":"studio","camera":"push_in","motif":"","actors":[{"who":"BENNY","x":600,"face":"shocked"}],"overlays":[{"type":"counter","from":0,"to":0,"prefix":"$","at":0.5}]},{"id":"t01","type":"card","cue":"L002","text":""},{"id":"k01","cue":"L003","set":"office","camera":"pan_left","actors":[{"who":"BENNY","x":600,"speaks":["L003"]}]}]}, [{"id":"L001","speaker":"N","text":"In two days, Nvidia lost about four hundred and thirty billion dollars in value... and it hadn't sold one chip less.","d":8.125,"est":true,"a":0.2},{"id":"L002","speaker":"N","text":"No factory closed.","d":1.246,"est":true,"a":8.465},{"id":"L003","speaker":"N","text":"No customer walked away.","d":1.629,"est":true,"a":9.851},{"id":"L004","speaker":"N","text":"No forecast was cut.","d":1.629,"est":true,"a":11.62},{"id":"L005","speaker":"N","text":"So why is Nvidia down over its CEO?","d":3.157,"est":true,"a":13.389},{"id":"L006","speaker":"BENNY","text":"I don't even own Nvidia.","d":2.011,"est":true,"a":16.726},{"id":"L007","speaker":"HAL","text":"You own an index fund. You own a lot of Nvidia.","d":4.304,"est":true,"a":18.877},{"id":"L008","speaker":"N","text":"The short answer is three things. One man. One empty chair. And one argument in Washington.","d":6.215,"est":true,"a":23.361},{"id":"L009","speaker":"N","text":"It starts on a Sunday, the eighth of November, with a statement from the board.","d":5.832,"est":true,"a":29.716},{"id":"L010","speaker":"N","text":"But first... why is this your problem?","d":2.775,"est":true,"a":35.688},{"id":"L011","speaker":"N","text":"The most popular kind of index fund in America holds five hundred companies. They are not equal slices. The bigger the company, the bigger its slice.","d":10.036,"est":true,"a":38.603},{"id":"L012","speaker":"N","text":"Before the drop, about seven dollars of every hundred in that fund was one company. This one.","d":6.597,"est":true,"a":48.779},{"id":"L013","speaker":"N","text":"The research firm Trefis checked one big S&P 500 fund as of the fourth of November: seven point three percent. A popular Nasdaq fund, about eight.","d":10.036,"est":true,"a":55.516},{"id":"L014","speaker":"N","text":"Keep that seven in mind.","d":2.011,"est":true,"a":65.692},{"id":"L015","speaker":"MARTHA","text":"I picked the boring fund on purpose.","d":2.775,"est":true,"a":67.883},{"id":"L016","speaker":"CHAD","text":"Boring fund. Spicy chip.","d":1.629,"est":true,"a":70.798},{"id":"L017","speaker":"N","text":"The arithmetic is simple. When Nvidia moves ten percent, the whole index moves about seven tenths of one percent... with every other company standing still.","d":9.654,"est":true,"a":72.607},{"id":"L018","speaker":"N","text":"So do the sum. If you had a hundred thousand dollars in that fund, Nvidia's two-day fall alone took more than six hundred dollars off it. The rest of the market rose on Monday, and hid it.","d":14.24,"est":true,"a":82.401},{"id":"L019","speaker":"N","text":"You didn't pick the stock. You didn't read the headline. You were just standing under the tent.","d":6.597,"est":true,"a":96.781},{"id":"L020","speaker":"BENNY","text":"What's holding this thing up?","d":2.011,"est":true,"a":103.558},{"id":"L021","speaker":"HAL","text":"Don't look up.","d":1.246,"est":true,"a":105.709},{"id":"L022","speaker":"N","text":"He looks up.","d":1.246,"est":true,"a":107.135},{"id":"L023","speaker":"N","text":"It's one pole.","d":1.246,"est":true,"a":108.521},{"id":"L024","speaker":"N","text":"Nvidia was founded in 1993. Its chief executive, Jensen Huang, has run it ever since. Thirty-three years, one boss.","d":7.361,"est":true,"a":109.907},{"id":"L025","speaker":"N","text":"The company grew from a start-up into one of the most valuable businesses on earth. The pole never changed.","d":7.361,"est":true,"a":117.408},{"id":"L026","speaker":"N","text":"The company knew it. Years ago, its own annual report warned that losing its key people, and it named him, would harm the business.","d":9.272,"est":true,"a":124.909},{"id":"L027","speaker":"N","text":"And it said it carried no insurance on him.","d":3.539,"est":true,"a":134.321},{"id":"L028","speaker":"HAL","text":"I'd like to insure one pole.","d":2.393,"est":true,"a":138.04},{"id":"L029","speaker":"REGGIE","text":"How many poles do you have?","d":2.393,"est":true,"a":140.573},{"id":"L030","speaker":"HAL","text":"One.","d":0.482,"est":true,"a":143.106},{"id":"L031","speaker":"REGGIE","text":"Next.","d":0.482,"est":true,"a":143.728},{"id":"L032","speaker":"N","text":"So who takes over if he goes? Publicly, nobody has been named.","d":4.686,"est":true,"a":144.39},{"id":"L033","speaker":"N","text":"One Wall Street analyst, Dan Ives of Yorkville Ives, put it bluntly. He said there is no succession plan.","d":7.361,"est":true,"a":149.216},{"id":"L034","speaker":"N","text":"In a note to clients, he used two more words about the chief executive. Not replaceable.","d":6.215,"est":true,"a":156.717},{"id":"L035","speaker":"N","text":"And the pole has a second job. When Washington talks about banning chip sales to China, he is the one who shows up to argue against it.","d":10.418,"est":true,"a":163.072},{"id":"L036","speaker":"REGGIE","text":"Who speaks for the chip business?","d":2.393,"est":true,"a":173.67},{"id":"L037","speaker":"CHAD","text":"Him.","d":0.482,"est":true,"a":176.203},{"id":"L038","speaker":"REGGIE","text":"And if he can't?","d":1.629,"est":true,"a":176.825},{"id":"L039","speaker":"CHAD","text":"...Also him.","d":0.864,"est":true,"a":178.594},{"id":"L040","speaker":"N","text":"One man. Two jobs. Now meet the customer.","d":3.157,"est":true,"a":179.638},{"id":"L041","speaker":"N","text":"Because this story did not start with a board. It started with a buyer.","d":5.45,"est":true,"a":182.935},{"id":"L042","speaker":"N","text":"Megaspeed is a company based in Singapore. According to news reports, it was spun out of a Chinese firm, and it has bought billions of dollars of Nvidia's chips.","d":11.183,"est":true,"a":188.525},{"id":"L043","speaker":"N","text":"Here is why that matters. American rules stop Nvidia from selling its most advanced chips to China.","d":6.597,"est":true,"a":199.848},{"id":"L044","speaker":"N","text":"But what about renting them?","d":2.011,"est":true,"a":206.585},{"id":"L045","speaker":"N","text":"Think of an oven you're not allowed to ship abroad. Fine. The oven stays put. But can a customer far away rent the kitchen... and cook over the phone?","d":11.183,"est":true,"a":208.736},{"id":"L046","speaker":"REGGIE","text":"Did the oven leave the country?","d":2.393,"est":true,"a":220.099},{"id":"L047","speaker":"CHAD","text":"No, sir.","d":0.864,"est":true,"a":222.632},{"id":"L048","speaker":"REGGIE","text":"Did the dinner?","d":1.246,"est":true,"a":223.636},{"id":"L049","speaker":"CHAD","text":"...Define dinner.","d":0.864,"est":true,"a":225.022},{"id":"L050","speaker":"N","text":"That is the gap lawmakers are now arguing about: whether renting that computing power to users in China counts as an export at all.","d":9.272,"est":true,"a":226.066},{"id":"L051","speaker":"N","text":"And Singapore says it has no legal duty to enforce another country's export rules.","d":5.45,"est":true,"a":235.478},{"id":"L052","speaker":"N","text":"Reporters began asking about Megaspeed back in 2025. Nvidia's answer was steady. In the last days of October this year, its chief executive told Bloomberg those dealings were, quote, \"normal and not unusual.\"","d":12.711,"est":true,"a":241.068},{"id":"L053","speaker":"BENNY","text":"Anything unusual in there?","d":1.629,"est":true,"a":253.959},{"id":"L054","speaker":"HAL","text":"Nothing unusual.","d":0.864,"est":true,"a":255.728},{"id":"L055","speaker":"BENNY","text":"That's what the sign says.","d":2.011,"est":true,"a":256.732},{"id":"L056","speaker":"HAL","text":"I wrote the sign.","d":1.629,"est":true,"a":258.883},{"id":"L057","speaker":"N","text":"Days later, the story stopped being about a customer.","d":3.539,"est":true,"a":260.692},{"id":"L058","speaker":"N","text":"Sunday, the eighth of November.","d":2.011,"est":true,"a":264.371},{"id":"L059","speaker":"N","text":"Nvidia's board announces an independent investigation. Its reason, in its own words: reporting that its chief executive had been, quote, \"the target of a foreign intelligence effort.\"","d":10.418,"est":true,"a":266.522},{"id":"L060","speaker":"N","text":"Here is what is claimed, and by whom. News reports say American officials believe a former Megaspeed executive worked for Chinese intelligence. China denies it. The reports rest on unnamed people, and nothing has been proven in public.","d":14.622,"est":true,"a":277.08},{"id":"L061","speaker":"N","text":"The same day, the company publishes an email from the chief executive to staff. In it, he admits he was unfaithful to his wife, names nobody, and writes that he had, quote, \"fallen short.\"","d":13.094,"est":true,"a":291.842},{"id":"L062","speaker":"N","text":"The board adds one more line. It says it has no reason to believe that national security or company secrets were compromised.","d":8.508,"est":true,"a":305.076},{"id":"L063","speaker":"N","text":"The investigation is run by directors who don't work for him, with an outside law firm. At the time, the company said he planned to stay in the job while they look.","d":12.329,"est":true,"a":313.724},{"id":"L064","speaker":"BENNY","text":"Should I be reading this at midnight?","d":2.775,"est":true,"a":326.233},{"id":"L065","speaker":"MARTHA","text":"No.","d":0.482,"est":true,"a":329.148},{"id":"L066","speaker":"BENNY","text":"...I'm reading it.","d":1.246,"est":true,"a":329.77},{"id":"L067","speaker":"N","text":"Monday. The opening bell. By the close, the shares are down a little more than four percent.","d":6.597,"est":true,"a":331.196},{"id":"L068","speaker":"N","text":"That same day, a shareholder files a lawsuit. It says calling those dealings normal was misleading, and that investors were kept in the dark. Those claims have not been tested in court.","d":12.329,"est":true,"a":337.933},{"id":"L069","speaker":"N","text":"Tuesday. Down again. Almost five and a half percent.","d":3.539,"est":true,"a":350.402},{"id":"L070","speaker":"N","text":"To be fair, Tuesday had a second problem. Inflation came in hot that morning, and the whole market slipped.","d":7.361,"est":true,"a":354.081},{"id":"L071","speaker":"CHAD","text":"Is it the boss or is it inflation?","d":3.157,"est":true,"a":361.622},{"id":"L072","speaker":"HAL","text":"Yes.","d":0.482,"est":true,"a":364.919},{"id":"L073","speaker":"N","text":"Two days. About nine and a half percent.","d":3.157,"est":true,"a":365.581},{"id":"L074","speaker":"N","text":"But an investigation doesn't change how many chips you sell. So what, exactly, were investors selling?","d":6.215,"est":true,"a":368.878},{"id":"L075","speaker":"N","text":"They were selling two fears.","d":2.011,"est":true,"a":375.233},{"id":"L076","speaker":"N","text":"Fear one. The pole leaves.","d":2.011,"est":true,"a":377.384},{"id":"L077","speaker":"N","text":"Dan Ives, the same analyst, wrote that the company would be worth twenty-five to thirty percent less if the chief executive were removed. That's a forecast, not a fact.","d":11.183,"est":true,"a":379.535},{"id":"L078","speaker":"N","text":"Put his what-if into your hundred thousand dollars from earlier.","d":3.922,"est":true,"a":390.858},{"id":"L079","speaker":"N","text":"Up to about two thousand dollars, from one company.","d":3.539,"est":true,"a":394.92},{"id":"L080","speaker":"N","text":"That's our arithmetic on his what-if, not a prediction.","d":3.539,"est":true,"a":398.599},{"id":"L081","speaker":"N","text":"On Wednesday, the firm Baird cut its rating on the stock, and cut its price target from five hundred dollars to two hundred. One reason it gave: it can't tell whether he keeps the job.","d":13.476,"est":true,"a":402.278},{"id":"L082","speaker":"BENNY","text":"What's your price target?","d":1.629,"est":true,"a":415.934},{"id":"L083","speaker":"HAL","text":"Depends.","d":0.482,"est":true,"a":417.703},{"id":"L084","speaker":"BENNY","text":"On what?","d":0.864,"est":true,"a":418.325},{"id":"L085","speaker":"HAL","text":"On one guy's calendar.","d":1.629,"est":true,"a":419.329},{"id":"L086","speaker":"N","text":"Fear two. The argument is lost.","d":2.393,"est":true,"a":421.138},{"id":"L087","speaker":"N","text":"On Tuesday, the news site The Information reported that the former executive helped arrange about seven and a half billion dollars of Nvidia chip sales to Chinese companies.","d":10.801,"est":true,"a":423.671},{"id":"L088","speaker":"N","text":"Megaspeed denies any illegal chip transfers. And no investigation has published a finding.","d":5.068,"est":true,"a":434.612},{"id":"L089","speaker":"N","text":"Washington moved anyway. Remember the kitchen? Lawmakers are pushing three China chip bills into this year's defense bill, and some have asked the chief executive to come and explain.","d":11.183,"est":true,"a":439.82},{"id":"L090","speaker":"N","text":"One senator, Michael Bennet, pressed the administration on why it had not stopped Megaspeed already.","d":5.832,"est":true,"a":451.143},{"id":"L091","speaker":"CHAD","text":"He used to walk in here and win.","d":3.157,"est":true,"a":457.155},{"id":"L092","speaker":"REGGIE","text":"He used to walk in here.","d":2.393,"est":true,"a":460.452},{"id":"L093","speaker":"N","text":"So that is the trade. If he goes, the company loses its builder. If he stays, it may lose its best argument. Either way, the price had to move.","d":11.183,"est":true,"a":463.025},{"id":"L094","speaker":"N","text":"But how big is big, for a boss in trouble?","d":3.922,"est":true,"a":474.348},{"id":"L095","speaker":"N","text":"Other tents have shaken before.","d":2.011,"est":true,"a":478.41},{"id":"L096","speaker":"N","text":"Three companies. Three bosses. Three very different days.","d":3.157,"est":true,"a":480.561},{"id":"L097","speaker":"N","text":"August 2011. Steve Jobs resigned as Apple's chief executive. His successor, Tim Cook, had already been running the company day to day.","d":8.508,"est":true,"a":483.858},{"id":"L098","speaker":"N","text":"The next day, Apple's shares closed down less than one percent.","d":4.304,"est":true,"a":492.506},{"id":"L099","speaker":"N","text":"The market as a whole fell more, about one and a half percent.","d":5.068,"est":true,"a":496.95},{"id":"L100","speaker":"N","text":"May 2025. Warren Buffett told shareholders he would step down as Berkshire Hathaway's chief executive at the end of the year.","d":8.125,"est":true,"a":502.158},{"id":"L101","speaker":"N","text":"His heir, Greg Abel, had been named years before. And Buffett would stay on as chairman.","d":6.215,"est":true,"a":510.423},{"id":"L102","speaker":"N","text":"The next trading day, the shares still fell about five percent. About fifty-nine billion dollars of value, gone.","d":6.979,"est":true,"a":516.778},{"id":"L103","speaker":"CHAD","text":"They had a spare pole for years!","d":2.775,"est":true,"a":523.937},{"id":"L104","speaker":"HAL","text":"Still cost five percent to swap it.","d":2.775,"est":true,"a":526.852},{"id":"L105","speaker":"N","text":"September 2018. America's market regulator, the SEC, sued Elon Musk, Tesla's chief executive.","d":5.068,"est":true,"a":529.807},{"id":"L106","speaker":"N","text":"It accused him of securities fraud over tweets about taking Tesla private, and asked to bar him from running a public company.","d":8.508,"est":true,"a":535.015},{"id":"L107","speaker":"N","text":"The company wasn't the defendant. He was.","d":2.775,"est":true,"a":543.663},{"id":"L108","speaker":"N","text":"The next day, Tesla's shares fell nearly fourteen percent.","d":3.539,"est":true,"a":546.578},{"id":"L109","speaker":"N","text":"He had called the case unjustified, and settled the day after without admitting or denying it.","d":6.215,"est":true,"a":550.257},{"id":"L110","speaker":"N","text":"Line them up. Apple had an heir ready, and lost less than one percent. Berkshire had one too, and still lost five percent. Tesla's danger was to the man himself, and it lost almost fourteen.","d":13.476,"est":true,"a":556.612},{"id":"L111","speaker":"N","text":"Nvidia's two days, about nine and a half percent, sit between Berkshire and Tesla.","d":5.45,"est":true,"a":570.228},{"id":"L112","speaker":"N","text":"Nvidia has no heir named in public. And this review is about its boss, not about its chips.","d":6.979,"est":true,"a":575.818},{"id":"L113","speaker":"N","text":"That's a comparison of size, not a forecast.","d":3.157,"est":true,"a":582.937},{"id":"L114","speaker":"N","text":"And then, on Wednesday, it went up.","d":2.775,"est":true,"a":586.234},{"id":"L115","speaker":"N","text":"Wednesday, the eleventh.","d":1.246,"est":true,"a":589.149},{"id":"L116","speaker":"N","text":"A company called CoreWeave, which rents out Nvidia chips, had reported strong results the evening before. Chip stocks jumped, and Nvidia jumped with them.","d":9.272,"est":true,"a":590.535},{"id":"L117","speaker":"CHAD","text":"We're back!","d":0.864,"est":true,"a":599.987},{"id":"L118","speaker":"HAL","text":"We're Wednesday.","d":0.864,"est":true,"a":600.991},{"id":"L119","speaker":"N","text":"By the closing bell, nothing about the investigation had changed. What Wednesday's trading showed is that the demand had not changed either.","d":8.508,"est":true,"a":602.035},{"id":"L120","speaker":"N","text":"Nvidia's own forecast for this quarter is about one hundred and eight billion dollars in sales. It has announced no change to that number.","d":9.272,"est":true,"a":610.683},{"id":"L121","speaker":"N","text":"By the close, your seven dollars got a little of itself back. Not all.","d":5.45,"est":true,"a":620.095},{"id":"L122","speaker":"N","text":"And here is the part almost nobody noticed.","d":3.157,"est":true,"a":625.685},{"id":"L123","speaker":"N","text":"That forecast assumes no data center chip sales to China. None.","d":4.304,"est":true,"a":628.982},{"id":"L124","speaker":"N","text":"So the fight in Washington is over money that isn't in the number. The risk is not this quarter. It's the rules for the quarters after it.","d":10.418,"est":true,"a":633.426},{"id":"L125","speaker":"N","text":"If the kitchen door gets locked, the buyers who rent that kitchen need fewer ovens. That is the sale investors can't see yet.","d":8.89,"est":true,"a":643.984},{"id":"L126","speaker":"MARTHA","text":"So the business is fine.","d":2.011,"est":true,"a":653.054},{"id":"L127","speaker":"BENNY","text":"The business is fine.","d":1.629,"est":true,"a":655.205},{"id":"L128","speaker":"MARTHA","text":"Then why did it cost me six hundred dollars?","d":3.539,"est":true,"a":656.974},{"id":"L129","speaker":"BENNY","text":"...Look up.","d":0.864,"est":true,"a":660.653},{"id":"L130","speaker":"N","text":"Then the closing bell rang. And Wednesday wasn't over.","d":3.539,"est":true,"a":661.697},{"id":"L131","speaker":"N","text":"After the close, the bounce ran out.","d":2.775,"est":true,"a":665.376},{"id":"L132","speaker":"N","text":"Two newspapers published reports. Both rest on people they did not name.","d":4.686,"est":true,"a":668.291},{"id":"L133","speaker":"N","text":"The New York Times reported a second relationship, which the company has not commented on.","d":5.832,"est":true,"a":673.117},{"id":"L134","speaker":"N","text":"And The Wall Street Journal reported that Nvidia's board is preparing to remove its chief executive.","d":6.215,"est":true,"a":679.089},{"id":"L135","speaker":"N","text":"Nvidia did not immediately respond to requests for comment on that report.","d":4.686,"est":true,"a":685.444},{"id":"L136","speaker":"N","text":"As of Wednesday night, the board had made no new public statement.","d":4.686,"est":true,"a":690.27},{"id":"L137","speaker":"N","text":"In after-hours trading, before Thursday's open, the shares fell more than eight percent.","d":5.068,"est":true,"a":695.096},{"id":"L138","speaker":"N","text":"That wiped out Wednesday's gain, and more.","d":2.775,"est":true,"a":700.304},{"id":"L139","speaker":"N","text":"Remember the seven dollars? On a hundred thousand dollars in that fund, that's roughly another five or six hundred dollars from Nvidia's slice... if it holds.","d":10.036,"est":true,"a":703.219},{"id":"L140","speaker":"N","text":"It's a snapshot, not a close. And that's our arithmetic, not a forecast.","d":5.068,"est":true,"a":713.395},{"id":"L141","speaker":"BENNY","text":"You said, \"We're Wednesday.\"","d":1.629,"est":true,"a":718.643},{"id":"L142","speaker":"HAL","text":"It's still Wednesday.","d":1.246,"est":true,"a":720.412},{"id":"L143","speaker":"N","text":"So is it over?","d":1.629,"est":true,"a":721.838},{"id":"L144","speaker":"N","text":"Not yet.","d":0.864,"est":true,"a":723.607},{"id":"L145","speaker":"N","text":"The price is waiting on three doors. Door one, the board's investigation, which has found nothing in public so far.","d":7.743,"est":true,"a":724.611},{"id":"L146","speaker":"N","text":"How does a review like this work?","d":2.775,"est":true,"a":732.494},{"id":"L147","speaker":"N","text":"A guide by two corporate lawyers, published on Harvard Law School's governance forum, lays out the usual shape.","d":6.979,"est":true,"a":735.409},{"id":"L148","speaker":"N","text":"The committee directs the review, not its lawyers. And the lawyers should answer to the committee alone, not to the company.","d":8.125,"est":true,"a":742.528},{"id":"L149","speaker":"N","text":"At the end, the committee reports its findings to the board. The guide doesn't say they must be published.","d":7.361,"est":true,"a":750.793},{"id":"L150","speaker":"N","text":"Nvidia's board gave no deadline.","d":2.011,"est":true,"a":758.294},{"id":"L151","speaker":"N","text":"But The Wall Street Journal reports the board could meet soon to decide his future.","d":5.832,"est":true,"a":760.445},{"id":"L152","speaker":"N","text":"No decision had been reported by Wednesday night.","d":3.157,"est":true,"a":766.417},{"id":"L153","speaker":"N","text":"Door two, Washington, where none of those bills is law so far.","d":4.686,"est":true,"a":769.714},{"id":"L154","speaker":"N","text":"Door three is a date. Tuesday, the seventeenth of November. After the closing bell, Nvidia is due to report its results, and whoever leads it then takes questions from the people who price the stock.","d":13.476,"est":true,"a":774.54},{"id":"L155","speaker":"N","text":"The next day, three House committee chairs want a closed-door briefing.","d":4.304,"est":true,"a":788.156},{"id":"L156","speaker":"CHAD","text":"What's the first question going to be?","d":2.775,"est":true,"a":792.64},{"id":"L157","speaker":"BENNY","text":"It won't be about chips.","d":2.011,"est":true,"a":795.555},{"id":"L158","speaker":"N","text":"The bar is already up. Analysts, on average, expect a little more than Nvidia's own forecast: nearly one hundred and nine billion dollars, according to a tally in The Motley Fool.","d":11.947,"est":true,"a":797.746},{"id":"L159","speaker":"N","text":"That's more than a billion dollars of sales a day.","d":3.922,"est":true,"a":809.833},{"id":"L160","speaker":"N","text":"Listen for three things that day. Does the forecast move? Does the board say anything new? And does anyone say the word China?","d":8.89,"est":true,"a":813.895},{"id":"L161","speaker":"N","text":"On the first one, a writer at The Motley Fool points to the forecast for the next quarter. A weak one, he argues, could be a sign that AI spending is slowing. That's an opinion, not a fact.","d":14.622,"est":true,"a":822.925},{"id":"L162","speaker":"N","text":"Whatever the board decides, one thing has already changed. Investors have now seen the empty chair. As of Wednesday night, neither report names anyone to fill it. A company this big does not get to leave it empty forever.","d":15.004,"est":true,"a":837.687},{"id":"L163","speaker":"N","text":"And you have seen your seven dollars. You own this story whether you follow it or not.","d":6.597,"est":true,"a":852.831},{"id":"L164","speaker":"BENNY","text":"Is one pole normal?","d":1.629,"est":true,"a":859.608},{"id":"L165","speaker":"HAL","text":"It's not unusual.","d":1.246,"est":true,"a":861.377},{"id":"L166","speaker":"N","text":"So why is Nvidia down over its CEO?","d":3.157,"est":true,"a":862.803},{"id":"L167","speaker":"N","text":"Not because it sold one chip less. Because one man's trouble made everyone look up at the same time...","d":7.361,"est":true,"a":866.1},{"id":"L168","speaker":"N","text":"...and count the poles.","d":1.629,"est":true,"a":873.601}], 876.23);
