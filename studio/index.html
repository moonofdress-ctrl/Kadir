.791],[3.838,3.965],[4.047,4.616],[4.639,4.79],[4.859,5.196],[5.266,5.66],[5.73,5.91]],"d":5.91,"est":false,"a":62.89},{"id":"L016","speaker":"N","text":"Monday, the shares fall about four percent. Tuesday, about five and a half more.","dir":"number","wt":[[0,0.592],[0.65,0.789],[0.848,1.219],[1.289,1.544],[1.614,1.858],[1.95,2.252],[2.322,2.995],[3.067,3.822],[3.973,4.321],[4.379,4.646],[4.681,4.785],[4.82,4.867],[4.925,5.145],[5.215,5.59]],"d":5.59,"est":false,"a":68.94},{"id":"L017","speaker":"MARTHA","text":"Nine and a half percent?","dir":"plain","wt":[[0,0.325],[0.348,0.418],[0.453,0.488],[0.546,0.685],[0.731,1.19]],"d":1.19,"est":false,"a":74.71},{"id":"L018","speaker":"HAL","text":"Over a review.","dir":"plain","wt":[[0,0.259],[0.317,0.34],[0.41,0.91]],"d":0.91,"est":false,"a":76.04},{"id":"L019","speaker":"MARTHA","text":"Not a finding?","dir":"plain","wt":[[0,0.174],[0.209,0.232],[0.279,0.77]],"d":0.77,"est":false,"a":77.09},{"id":"L020","speaker":"HAL","text":"I don't wait for findings. I sold Monday.","dir":"joke","wt":[[0,0.041],[0.099,0.239],[0.262,0.39],[0.424,0.529],[0.587,1.28],[1.36,1.418],[1.546,1.836],[1.894,2.31]],"d":2.31,"est":false,"a":78},{"id":"L021","speaker":"MARTHA","text":"So what's the question?","dir":"plain","wt":[[0,0.163],[0.209,0.395],[0.43,0.499],[0.534,1.15]],"d":1.15,"est":false,"a":80.45},{"id":"L022","speaker":"HAL","text":"The one on the door.","dir":"plain","wt":[[0,0.083],[0.152,0.35],[0.408,0.5],[0.535,0.605],[0.651,1.13]],"d":1.13,"est":false,"a":81.74},{"id":"L023","speaker":"N","text":"That was Sunday. By Thursday, the question had moved... from what happened, to who's in charge.","dir":"turn","wt":[[0,0.154],[0.2,0.293],[0.363,1],[1.126,1.335],[1.44,2.02],[2.043,2.113],[2.171,2.636],[2.694,2.81],[2.879,3.37],[3.475,3.66],[3.707,3.869],[3.927,4.48],[4.551,4.667],[4.725,4.946],[5.004,5.051],[5.109,5.64]],"d":5.64,"est":false,"a":83.05},{"id":"L024","speaker":"N","text":"To see why that hurts, count his seats.","dir":"recap","wt":[[0,0.104],[0.174,0.336],[0.383,0.499],[0.557,0.696],[0.754,1.079],[1.137,1.404],[1.463,1.602],[1.648,2.15]],"d":2.15,"est":false,"a":89.83},{"id":"L025","speaker":"N","text":"Jensen Huang founded Nvidia thirty-three years ago. He was its chief executive. Its president. And a member of its board.","dir":"number","wt":[[0,0.456],[0.526,0.804],[0.92,1.362],[1.431,1.872],[1.942,2.581],[2.615,2.882],[2.929,3.405],[3.514,3.676],[3.734,3.897],[3.967,4.118],[4.187,4.466],[4.536,5.46],[5.551,5.772],[5.841,6.549],[6.627,6.802],[6.871,6.906],[6.964,7.278],[7.347,7.417],[7.475,7.626],[7.684,8.16]],"d":8.16,"est":false,"a":92.12},{"id":"L026","speaker":"N","text":"And no successor had been named in public.","dir":"plain","wt":[[0,0.157],[0.239,0.39],[0.471,1.063],[1.133,1.225],[1.272,1.458],[1.516,1.806],[1.852,1.922],[1.992,2.47]],"d":2.47,"est":false,"a":100.42},{"id":"L027","speaker":"N","text":"For investors, that was simple: one face, one voice. It also meant that if he ever left, three seats would empty at once.","dir":"plain","wt":[[0,0.221],[0.29,0.952],[1.01,1.254],[1.312,1.463],[1.521,2.055],[2.249,2.47],[2.528,2.958],[3.097,3.306],[3.364,3.852],[3.953,4.104],[4.15,4.441],[4.522,4.708],[4.754,4.87],[4.893,4.986],[5.033,5.102],[5.172,5.346],[5.416,5.834],[6.02,6.356],[6.426,6.716],[6.774,6.937],[6.995,7.297],[7.355,7.424],[7.506,7.89]],"d":7.89,"est":false,"a":103.03},{"id":"L028","speaker":"BENNY","text":"So who was next in line?","dir":"plain","wt":[[0,0.143],[0.189,0.305],[0.34,0.456],[0.514,0.723],[0.769,0.828],[0.897,1.22]],"d":1.22,"est":false,"a":111.1},{"id":"L029","speaker":"MARTHA","text":"Nobody said.","dir":"plain","wt":[[0,0.36],[0.418,0.84]],"d":0.84,"est":false,"a":112.46},{"id":"L030","speaker":"BENNY","text":"Did anybody ask?","dir":"plain","wt":[[0,0.149],[0.195,0.555],[0.625,1.02]],"d":1.02,"est":false,"a":113.44},{"id":"L031","speaker":"MARTHA","text":"Everybody. Now.","dir":"joke","wt":[[0,0.627],[0.755,1.18]],"d":1.18,"est":false,"a":114.6},{"id":"L032","speaker":"REGGIE","text":"Who chairs your board?","dir":"plain","wt":[[0,0.151],[0.22,0.452],[0.499,0.603],[0.65,1.02]],"d":1.02,"est":false,"a":115.92},{"id":"L033","speaker":"CHIP","text":"Nobody.","dir":"plain","wt":[[0,0.537]],"d":0.537,"est":false,"a":117.08},{"id":"L034","speaker":"REGGIE","text":"Nobody?","dir":"plain","wt":[[0,0.54]],"d":0.54,"est":false,"a":117.757},{"id":"L035","speaker":"CHIP","text":"It never came up.","dir":"plain","wt":[[0,0.098],[0.133,0.307],[0.365,0.562],[0.609,1.03]],"d":1.03,"est":false,"a":118.437},{"id":"L036","speaker":"REGGIE","text":"It will.","dir":"joke","wt":[[0,0.186],[0.255,0.71]],"d":0.71,"est":false,"a":119.607},{"id":"L037","speaker":"N","text":"Until this week, Nvidia's board had no chair at all. The man at the top held the company's three biggest seats himself.","dir":"plain","wt":[[0,0.388],[0.469,0.667],[0.759,1.108],[1.166,1.77],[1.828,2.129],[2.199,2.373],[2.489,2.687],[2.768,3.058],[3.128,3.198],[3.256,3.68],[3.754,3.894],[3.952,4.126],[4.172,4.242],[4.288,4.358],[4.416,4.706],[4.776,4.973],[5.02,5.09],[5.148,5.647],[5.717,6.018],[6.076,6.448],[6.506,6.819],[6.866,7.47]],"d":7.47,"est":false,"a":120.497},{"id":"L038","speaker":"N","text":"Gil Luria of DA Davidson told Fox Business that much of the decision-making was concentrated in Huang.","dir":"plain","wt":[[0,0.36],[0.476,1.068],[1.219,1.37],[1.463,1.823],[1.892,2.496],[2.577,2.868],[2.984,3.286],[3.367,3.808],[3.855,4.017],[4.098,4.331],[4.377,4.423],[4.47,4.54],[4.586,5.329],[5.387,5.515],[5.584,6.351],[6.409,6.478],[6.56,7.07]],"d":7.07,"est":false,"a":128.107},{"id":"L039","speaker":"N","text":"So the risk was never only the reports. It was the empty seats they could leave behind.","dir":"recap","wt":[[0,0.186],[0.255,0.325],[0.383,0.627],[0.685,0.813],[0.894,1.149],[1.231,1.463],[1.509,1.579],[1.649,2.438],[2.548,2.688],[2.746,2.873],[2.931,3.001],[3.071,3.361],[3.442,3.779],[3.837,3.953],[3.976,4.116],[4.162,4.394],[4.452,5.04]],"d":5.04,"est":false,"a":135.317},{"id":"L040","speaker":"REGGIE","text":"Three tickets. One coat.","dir":"plain","wt":[[0,0.225],[0.26,0.713],[0.794,1.026],[1.096,1.44]],"d":1.44,"est":false,"a":140.537},{"id":"L041","speaker":"CHIP","text":"Is that allowed?","dir":"plain","wt":[[0,0.197],[0.255,0.418],[0.464,0.975]],"d":0.975,"est":false,"a":142.117},{"id":"L042","speaker":"REGGIE","text":"Allowed.","dir":"plain","wt":[[0,0.61]],"d":0.61,"est":false,"a":143.232},{"id":"L043","speaker":"CHIP","text":"Wise?","dir":"plain","wt":[[0,0.28]],"d":0.28,"est":false,"a":143.982},{"id":"L044","speaker":"REGGIE","text":"Different counter.","dir":"joke","wt":[[0,0.313],[0.36,0.84]],"d":0.84,"est":false,"a":144.402},{"id":"L045","speaker":"CHAD","text":"One guy, three jobs? Efficient.","dir":"plain","wt":[[0,0.174],[0.209,0.406],[0.43,0.604],[0.65,1.022],[1.08,1.57]],"d":1.57,"est":false,"a":145.382},{"id":"L046","speaker":"HAL","text":"Until he leaves all three.","dir":"joke","wt":[[0,0.317],[0.363,0.433],[0.502,0.816],[0.886,1.071],[1.129,1.55]],"d":1.55,"est":false,"a":147.092},{"id":"L047","speaker":"CHAD","text":"Who leaves all three?","dir":"plain","wt":[[0,0.137],[0.195,0.416],[0.462,0.602],[0.66,1.11]],"d":1.11,"est":false,"a":148.782},{"id":"L048","speaker":"HAL","text":"Keep lifting.","dir":"joke","wt":[[0,0.217],[0.287,0.8]],"d":0.8,"est":false,"a":150.032},{"id":"L049","speaker":"N","text":"On Friday, the sixth, the market valued Nvidia at about four and a half trillion dollars.","dir":"number","wt":[[0,0.166],[0.27,0.769],[0.804,0.909],[1.013,1.64],[1.722,1.838],[1.908,2.267],[2.325,2.755],[2.825,3.289],[3.347,3.44],[3.486,3.765],[3.835,4.079],[4.125,4.23],[4.276,4.311],[4.404,4.624],[4.694,5.216],[5.274,5.88]],"d":5.88,"est":false,"a":151.012},{"id":"L050","speaker":"BENNY","text":"Big week?","dir":"plain","wt":[[0,0.232],[0.29,0.58]],"d":0.58,"est":false,"a":157.072},{"id":"L051","speaker":"CHIP","text":"Huge. Nothing can go wrong.","dir":"joke","wt":[[0,0.499],[0.534,0.778],[0.813,0.906],[0.952,1.045],[1.08,1.43]],"d":1.43,"est":false,"a":157.792},{"id":"L052","speaker":"BENNY","text":"It's only Friday.","dir":"plain","wt":[[0,0.167],[0.214,0.411],[0.469,0.92]],"d":0.92,"est":false,"a":159.362},{"id":"L053","speaker":"N","text":"And then came Wednesday.","dir":"turn","wt":[[0,0.137],[0.184,0.335],[0.428,0.683],[0.729,1.36]],"d":1.36,"est":false,"a":160.462},{"id":"L054","speaker":"N","text":"Wednesday, the eleventh. The shares close up almost three percent, at about one hundred and seventy-four dollars.","dir":"number","wt":[[0,0.731],[0.778,0.894],[0.964,1.614],[1.723,1.874],[1.932,2.327],[2.396,2.721],[2.768,2.896],[2.965,3.325],[3.418,3.685],[3.743,4.254],[4.289,4.405],[4.451,4.765],[4.978,5.234],[5.28,5.594],[5.64,5.745],[5.803,6.406],[6.464,7.06]],"d":7.06,"est":false,"a":162.962},{"id":"L055","speaker":"N","text":"For a few hours, it looked as if the worst was over.","dir":"plain","wt":[[0,0.192],[0.25,0.297],[0.366,0.587],[0.657,1.191],[1.237,1.353],[1.411,1.667],[1.713,1.783],[1.852,1.957],[2.027,2.096],[2.178,2.514],[2.584,2.735],[2.816,3.24]],"d":3.24,"est":false,"a":170.162},{"id":"L056","speaker":"CHAD","text":"Green! We're back!","dir":"plain","wt":[[0,0.333],[0.38,0.577],[0.6,0.91]],"d":0.91,"est":false,"a":173.582},{"id":"L057","speaker":"HAL","text":"The bell rang, Chad.","dir":"joke","wt":[[0,0.073],[0.119,0.305],[0.374,0.746],[0.792,1.32]],"d":1.32,"est":false,"a":174.632},{"id":"L058","speaker":"CHAD","text":"So?","dir":"plain","wt":[[0,0.39]],"d":0.39,"est":false,"a":176.092},{"id":"L059","speaker":"HAL","text":"So the night shift starts.","dir":"joke","wt":[[0,0.146],[0.192,0.262],[0.297,0.471],[0.506,0.749],[0.784,1.307]],"d":1.307,"est":false,"a":176.622},{"id":"L060","speaker":"N","text":"After the close, two newspapers publish reports. The market reads both overnight.","dir":"plain","wt":[[0,0.302],[0.36,0.43],[0.476,1.045],[1.195,1.427],[1.497,2.101],[2.159,2.519],[2.6,3.308],[3.403,3.531],[3.612,3.995],[4.065,4.355],[4.425,4.703],[4.796,5.48]],"d":5.48,"est":false,"a":178.109},{"id":"L061","speaker":"N","text":"The New York Times reports a second relationship, with a senior Nvidia executive who reports to Huang.","dir":"plain","wt":[[0,0.104],[0.174,0.302],[0.348,0.58],[0.638,1.033],[1.103,1.521],[1.579,1.602],[1.718,2.055],[2.124,3.018],[3.165,3.351],[3.409,3.432],[3.502,3.862],[3.931,4.384],[4.454,5.092],[5.115,5.232],[5.313,5.742],[5.8,5.893],[5.963,6.45]],"d":6.45,"est":false,"a":183.729},{"id":"L062","speaker":"N","text":"Neither Nvidia nor Huang had confirmed it. We're not saying it's true. We're saying it was reported.","dir":"limit","wt":[[0,0.375],[0.444,0.932],[1.025,1.292],[1.385,1.803],[1.872,2.012],[2.081,2.592],[2.639,2.89],[2.958,3.225],[3.272,3.434],[3.504,3.817],[3.875,4.038],[4.096,4.583],[4.674,4.929],[4.976,5.301],[5.382,5.498],[5.556,5.707],[5.777,6.41]],"d":6.41,"est":false,"a":190.319},{"id":"L063","speaker":"N","text":"The Wall Street Journal reports that the board is preparing to remove him.","dir":"plain","wt":[[0,0.104],[0.162,0.418],[0.476,0.789],[0.847,1.195],[1.277,1.753],[1.799,1.939],[1.962,2.031],[2.089,2.368],[2.426,2.496],[2.565,3.065],[3.134,3.227],[3.309,3.703],[3.761,4.05]],"d":4.05,"est":false,"a":196.869},{"id":"L064","speaker":"CHAD","text":"So it's true?","dir":"plain","wt":[[0,0.174],[0.232,0.36],[0.406,0.77]],"d":0.77,"est":false,"a":201.099},{"id":"L065","speaker":"REGGIE","text":"Allegation.","dir":"plain","wt":[[0,0.86]],"d":0.86,"est":false,"a":202.009},{"id":"L066","speaker":"CHAD","text":"So it's false?","dir":"plain","wt":[[0,0.163],[0.221,0.348],[0.406,0.89]],"d":0.89,"est":false,"a":203.009},{"id":"L067","speaker":"REGGIE","text":"Allegation.","dir":"plain","wt":[[0,0.92]],"d":0.92,"est":false,"a":204.039},{"id":"L068","speaker":"CHAD","text":"So what is it?","dir":"plain","wt":[[0,0.163],[0.221,0.372],[0.43,0.534],[0.592,0.79]],"d":0.79,"est":false,"a":205.099},{"id":"L069","speaker":"REGGIE","text":"Reported.","dir":"plain","wt":[[0,0.62]],"d":0.62,"est":false,"a":206.029},{"id":"L070","speaker":"BENNY","text":"Down eight percent? After the bell?","dir":"plain","wt":[[0,0.27],[0.34,0.514],[0.549,1.06],[1.195,1.427],[1.473,1.543],[1.566,1.84]],"d":1.84,"est":false,"a":206.789},{"id":"L071","speaker":"CHAD","text":"After-hours, bro. Market never sleeps.","dir":"plain","wt":[[0,0.639],[0.662,1.022],[1.184,1.486],[1.521,1.718],[1.776,2.25]],"d":2.25,"est":false,"a":208.769},{"id":"L072","speaker":"BENNY","text":"I'd like to.","dir":"joke","wt":[[0,0.167],[0.214,0.4],[0.446,0.74]],"d":0.74,"est":false,"a":211.159},{"id":"L073","speaker":"N","text":"In after-hours trading, the shares fall eight to nine percent.","dir":"number","wt":[[0,0.167],[0.237,0.934],[0.992,1.41],[1.444,1.549],[1.595,1.967],[2.06,2.35],[2.455,2.698],[2.745,2.814],[2.907,3.163],[3.209,3.82]],"d":3.82,"est":false,"a":212.079},{"id":"L074","speaker":"N","text":"So on Wednesday night, two clocks ran at once. The board's... and the market's.","dir":"turn","wt":[[0,0.232],[0.325,0.441],[0.511,0.975],[1.045,1.451],[1.553,1.809],[1.878,2.238],[2.296,2.482],[2.528,2.621],[2.714,3.26],[3.407,3.57],[3.639,4.243],[4.498,4.673],[4.731,4.8],[4.847,5.52]],"d":5.52,"est":false,"a":216.039},{"id":"L075","speaker":"MARTHA","text":"Two reports in one night.","dir":"plain","wt":[[0,0.167],[0.249,0.609],[0.655,0.725],[0.794,0.934],[0.98,1.39]],"d":1.39,"est":false,"a":221.739},{"id":"L076","speaker":"HAL","text":"Neither confirmed that night.","dir":"plain","wt":[[0,0.277],[0.323,0.811],[0.857,1.031],[1.113,1.44]],"d":1.44,"est":false,"a":223.269},{"id":"L077","speaker":"MARTHA","text":"So it's not proven.","dir":"plain","wt":[[0,0.151],[0.221,0.348],[0.418,0.639],[0.708,1.27]],"d":1.27,"est":false,"a":224.849},{"id":"L078","speaker":"HAL","text":"Not proven. Still priced.","dir":"plain","wt":[[0,0.171],[0.217,0.739],[0.902,1.134],[1.204,1.63]],"d":1.63,"est":false,"a":226.259},{"id":"L079","speaker":"N","text":"And according to Nvidia's own regulatory filing, the board accepted his resignation that same Wednesday.","dir":"plain","wt":[[0,0.209],[0.267,0.685],[0.743,0.824],[0.94,1.463],[1.556,1.823],[1.904,2.554],[2.635,3.28],[3.424,3.551],[3.621,3.923],[3.969,4.468],[4.538,4.677],[4.77,5.467],[5.548,5.769],[5.908,6.268],[6.326,6.96]],"d":6.96,"est":false,"a":228.069},{"id":"L080","speaker":"N","text":"Nvidia would announce it on Thursday.","dir":"plain","wt":[[0,0.522],[0.546,0.685],[0.731,1.08],[1.103,1.196],[1.242,1.358],[1.451,2.17]],"d":2.17,"est":false,"a":235.169},{"id":"L081","speaker":"N","text":"Thursday. Nvidia puts out a release. The board announces that Jensen Huang has resigned... as president, chief executive and a member of the board, effective immediately.","dir":"plain","wt":[[0,0.801],[0.915,1.391],[1.449,1.693],[1.739,1.856],[1.902,1.925],[1.983,2.622],[2.747,2.886],[2.945,3.2],[3.246,3.792],[3.85,4.013],[4.082,4.5],[4.57,4.872],[4.941,5.069],[5.15,5.905],[6.195,6.393],[6.509,7.21],[7.31,7.601],[7.659,8.355],[8.4,8.731],[8.801,8.847],[8.917,9.172],[9.23,9.277],[9.323,9.393],[9.439,9.9],[9.991,10.629],[10.687,11.54]],"d":11.54,"est":false,"a":238.479},{"id":"L082","speaker":"N","text":"The release gives no reason. And no handover date: effective immediately means now.","dir":"limit","wt":[[0,0.094],[0.175,0.57],[0.617,0.895],[1.011,1.185],[1.267,1.766],[1.906,2.08],[2.173,2.347],[2.44,2.916],[2.974,3.32],[3.421,4.095],[4.153,4.803],[4.861,5.116],[5.198,5.57]],"d":5.57,"est":false,"a":250.159},{"id":"L083","speaker":"N","text":"Some founders step down and stay on as chairman. Not here. He has no seat left.","dir":"plain","wt":[[0,0.325],[0.372,0.871],[0.987,1.289],[1.37,1.614],[1.672,1.741],[1.788,2.02],[2.09,2.206],[2.252,2.345],[2.415,2.984],[3.193,3.425],[3.495,3.901],[4.015,4.154],[4.224,4.398],[4.468,4.596],[4.677,4.909],[4.967,5.36]],"d":5.36,"est":false,"a":255.869},{"id":"L084","speaker":"CHAD","text":"One plate, please. Says boss.","dir":"plain","wt":[[0,0.197],[0.232,0.511],[0.534,0.836],[0.859,1.045],[1.103,1.49]],"d":1.49,"est":false,"a":261.409},{"id":"L085","speaker":"MARTHA","text":"Permanent or temporary?","dir":"plain","wt":[[0,0.433],[0.502,0.595],[0.653,1.28]],"d":1.28,"est":false,"a":263.039},{"id":"L086","speaker":"CHAD","text":"What's the difference?","dir":"plain","wt":[[0,0.205],[0.252,0.322],[0.356,0.91]],"d":0.91,"est":false,"a":264.459},{"id":"L087","speaker":"MARTHA","text":"Tape.","dir":"joke","wt":[[0,0.62]],"d":0.62,"est":false,"a":265.509},{"id":"L088","speaker":"N","text":"The chief executive's job goes to Colette Kress, Nvidia's finance chief since 2013. Her new title: interim chief executive... and chief financial officer. She keeps both.","dir":"number","wt":[[0,0.107],[0.165,0.432],[0.502,1.234],[1.303,1.64],[1.733,1.977],[2.023,2.104],[2.174,2.569],[2.615,3.23],[3.354,3.934],[4.027,4.55],[4.596,4.875],[4.944,5.2],[5.258,6.396],[6.518,6.703],[6.773,6.924],[6.994,7.562],[7.701,8.142],[8.235,8.502],[8.595,9.48],[9.581,9.906],[10.022,10.336],[10.498,11.172],[11.241,11.891],[12.041,12.204],[12.297,12.599],[12.668,13.12]],"d":13.12,"est":false,"a":266.309},{"id":"L089","speaker":"N","text":"Harvey Jones, on the board since 1993 and a former chief executive of Synopsys, becomes Nvidia's first-ever board chair.","dir":"plain","wt":[[0,0.39],[0.471,1.063],[1.158,1.333],[1.379,1.449],[1.495,1.774],[1.832,2.122],[2.18,3.283],[3.399,3.515],[3.573,3.596],[3.689,4.072],[4.142,4.409],[4.479,5.106],[5.152,5.199],[5.268,6.09],[6.169,6.61],[6.679,7.225],[7.295,7.887],[7.968,8.258],[8.305,8.74]],"d":8.74,"est":false,"a":279.569},{"id":"L090","speaker":"CHIP","text":"Who's in the chair?","dir":"plain","wt":[[0,0.175],[0.222,0.292],[0.35,0.419],[0.466,0.89]],"d":0.89,"est":false,"a":288.489},{"id":"L091","speaker":"REGGIE","text":"Which chair? There are two now.","dir":"joke","wt":[[0,0.205],[0.275,0.716],[0.948,1.169],[1.204,1.308],[1.343,1.494],[1.575,1.87]],"d":1.87,"est":false,"a":289.519},{"id":"L092","speaker":"CHIP","text":"Is that better?","dir":"plain","wt":[[0,0.128],[0.186,0.325],[0.383,0.87]],"d":0.87,"est":false,"a":291.529},{"id":"L093","speaker":"REGGIE","text":"It's more chairs.","dir":"joke","wt":[[0,0.166],[0.212,0.363],[0.41,0.94]],"d":0.94,"est":false,"a":292.539},{"id":"L094","speaker":"N","text":"In the release, Jones says the board has \"full confidence in Colette and the leadership team\". The release adds, \"Jensen's contributions to NVIDIA are profound.\"","dir":"plain","wt":[[0,0.126],[0.184,0.253],[0.312,0.764],[0.822,1.159],[1.182,1.414],[1.484,1.554],[1.612,1.902],[1.96,2.134],[2.216,2.552],[2.634,3.26],[3.307,3.377],[3.446,3.818],[3.864,3.98],[4.038,4.108],[4.154,4.677],[4.723,5.13],[5.226,5.365],[5.435,5.829],[5.887,6.43],[6.43,7.142],[7.2,8.013],[8.071,8.163],[8.245,8.756],[8.837,9.081],[9.139,9.9]],"d":9.9,"est":false,"a":293.659},{"id":"L095","speaker":"N","text":"And Kress says, \"Our focus remains on serving our customers, partners, developers and shareholders.\"","dir":"plain","wt":[[0,0.186],[0.279,0.592],[0.65,1.277],[1.28,1.631],[1.712,2.095],[2.165,2.583],[2.652,2.769],[2.838,3.21],[3.291,3.419],[3.488,4.22],[4.339,5.07],[5.174,5.917],[5.987,6.207],[6.289,7.19]],"d":7.19,"est":false,"a":303.699},{"id":"L096","speaker":"BENNY","text":"Does it say why?","dir":"plain","wt":[[0,0.184],[0.23,0.312],[0.37,0.59],[0.66,1.15]],"d":1.15,"est":false,"a":311.069},{"id":"L097","speaker":"MARTHA","text":"It says thank you.","dir":"plain","wt":[[0,0.139],[0.186,0.383],[0.43,0.65],[0.708,1.04]],"d":1.04,"est":false,"a":312.359},{"id":"L098","speaker":"BENNY","text":"That's not why.","dir":"plain","wt":[[0,0.253],[0.323,0.532],[0.602,0.99]],"d":0.99,"est":false,"a":313.539},{"id":"L099","speaker":"MARTHA","text":"Both sides checked.","dir":"plain","wt":[[0,0.244],[0.302,0.65],[0.708,1.18]],"d":1.18,"est":false,"a":314.669},{"id":"L100","speaker":"N","text":"The board starts a search for a permanent chief executive, looking at candidates inside and outside the company.","dir":"plain","wt":[[0,0.124],[0.194,0.484],[0.542,0.89],[0.937,0.983],[1.065,1.413],[1.471,1.633],[1.691,1.75],[1.889,2.342],[2.365,2.62],[2.702,3.537],[3.828,4.164],[4.222,4.315],[4.385,4.942],[5.035,5.65],[5.709,5.848],[5.941,6.498],[6.521,6.591],[6.637,7.18]],"d":7.18,"est":false,"a":316.029},{"id":"L101","speaker":"HAL","text":"Wanted: one chief executive.","dir":"plain","wt":[[0,0.61],[0.831,1.214],[1.295,1.655],[1.736,2.43]],"d":2.43,"est":false,"a":323.389},{"id":"L102","speaker":"CHAD","text":"Experience?","dir":"plain","wt":[[0,0.71]],"d":0.71,"est":false,"a":325.959},{"id":"L103","speaker":"HAL","text":"Running four trillion dollars.","dir":"plain","wt":[[0,0.308],[0.378,0.564],[0.61,0.97],[1.028,1.51]],"d":1.51,"est":false,"a":326.809},{"id":"L104","speaker":"CHAD","text":"I ran a lemonade stand.","dir":"joke","wt":[[0,0.073],[0.154,0.293],[0.328,0.352],[0.386,0.769],[0.804,1.22]],"d":1.22,"est":false,"a":328.459},{"id":"L105","speaker":"HAL","text":"Next.","dir":"joke","wt":[[0,0.58]],"d":0.58,"est":false,"a":329.819},{"id":"L106","speaker":"N","text":"So for now, Nvidia is run by the person who counts its money. Who is she?","dir":"turn","wt":[[0,0.267],[0.372,0.511],[0.58,1.01],[1.358,1.858],[1.916,1.997],[2.067,2.241],[2.299,2.392],[2.45,2.519],[2.577,2.949],[2.995,3.135],[3.228,3.576],[3.634,3.796],[3.866,4.33],[4.432,4.653],[4.757,4.862],[4.908,5.22]],"d":5.22,"est":false,"a":330.579},{"id":"L107","speaker":"N","text":"Colette Kress isn't new. She joined Nvidia as finance chief in September 2013.","dir":"number","wt":[[0,0.431],[0.466,0.814],[0.884,1.151],[1.22,1.673],[1.832,1.995],[2.088,2.378],[2.436,2.889],[2.982,3.098],[3.202,3.748],[3.783,4.073],[4.143,4.236],[4.294,4.874],[4.979,6]],"d":6,"est":false,"a":336.939},{"id":"L108","speaker":"N","text":"She's fifty-nine, according to Yahoo Finance.","dir":"number","wt":[[0,0.337],[0.395,1.068],[1.103,1.521],[1.567,1.637],[1.707,2.113],[2.183,2.81]],"d":2.81,"est":false,"a":343.079},{"id":"L109","speaker":"N","text":"Before that job, she ran finance for a unit at Cisco, and for Microsoft's server and tools division. Nearly twenty-five years in finance at tech companies.","dir":"plain","wt":[[0,0.433],[0.491,0.688],[0.758,1.3],[1.418,1.581],[1.674,1.906],[1.999,2.486],[2.533,2.684],[2.742,2.788],[2.881,3.125],[3.171,3.264],[3.334,4.03],[4.106,4.396],[4.477,4.617],[4.686,5.371],[5.511,5.94],[5.987,6.08],[6.138,6.44],[6.486,7.12],[7.262,7.646],[7.715,8.377],[8.423,8.69],[8.748,8.841],[8.923,9.41],[9.433,9.515],[9.561,9.747],[9.805,10.44]],"d":10.44,"est":false,"a":346.029},{"id":"L110","speaker":"MARTHA","text":"A quarter century under the hood.","dir":"plain","wt":[[0,0.081],[0.163,0.499],[0.569,1.08],[1.196,1.451],[1.498,1.567],[1.614,2.183]],"d":2.183,"est":false,"a":356.649},{"id":"L111","speaker":"HAL","text":"And now?","dir":"plain","wt":[[0,0.137],[0.219,0.62]],"d":0.62,"est":false,"a":358.972},{"id":"L112","speaker":"MARTHA","text":"Now she drives it too.","dir":"joke","wt":[[0,0.221],[0.302,0.418],[0.476,0.755],[0.801,0.871],[0.906,1.31]],"d":1.31,"est":false,"a":359.732},{"id":"L113","speaker":"HAL","text":"Then who's under the hood?","dir":"plain","wt":[[0,0.129],[0.175,0.396],[0.454,0.64],[0.675,0.744],[0.791,1.09]],"d":1.09,"est":false,"a":361.182},{"id":"L114","speaker":"N","text":"On Nvidia's earnings calls, she's the one who normally walks through the numbers.","dir":"plain","wt":[[0,0.232],[0.302,0.836],[0.894,1.242],[1.3,1.672],[1.741,2.067],[2.113,2.183],[2.252,2.38],[2.403,2.508],[2.577,2.972],[3.042,3.367],[3.413,3.622],[3.646,3.715],[3.738,4.28]],"d":4.28,"est":false,"a":362.452},{"id":"L115","speaker":"CHAD","text":"Two jobs at once? I can't do one.","dir":"plain","wt":[[0,0.159],[0.217,0.472],[0.507,0.577],[0.635,0.902],[0.948,0.995],[1.053,1.262],[1.308,1.401],[1.471,1.715]],"d":1.715,"est":false,"a":366.912},{"id":"L116","speaker":"HAL","text":"We know.","dir":"joke","wt":[[0,0.114],[0.161,0.58]],"d":0.58,"est":f
