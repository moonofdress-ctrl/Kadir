ch.","d":2.63,"est":false,"a":31.189},{"id":"L010","speaker":"N","text":"And that big number has a part almost nobody noticed.","d":3.46,"est":false,"a":33.959},{"id":"L011","speaker":"N","text":"So how did Poppi make one point nine five billion dollars from soda?","d":4.27,"est":false,"a":37.559},{"id":"L012","speaker":"N","text":"It starts around 2015, in a family kitchen. Allison has stomach troubles. So she mixes apple cider vinegar, fruit and soda water.","d":8.61,"est":false,"a":41.969},{"id":"L013","speaker":"N","text":"Her husband, Stephen, helps sell it at farmers' markets in Dallas. Within months, a Whole Foods buyer agrees to stock it.","d":7.3,"est":false,"a":50.719},{"id":"L014","speaker":"MARTHA","text":"Vinegar. In a soda.","d":1.3,"est":false,"a":58.199},{"id":"L015","speaker":"SODA","text":"With fruit!","d":0.61,"est":false,"a":59.639},{"id":"L016","speaker":"MARTHA","text":"Who drinks vinegar on purpose?","d":1.5,"est":false,"a":60.389},{"id":"L017","speaker":"SODA","text":"People with stomachs?","d":1,"est":false,"a":62.029},{"id":"L018","speaker":"MARTHA","text":"...Fine. You're in.","d":0.96,"est":false,"a":63.169},{"id":"L019","speaker":"N","text":"The first eighteen months bring in about five hundred thousand dollars of sales. Growing costs far more.","d":5.94,"est":false,"a":64.309},{"id":"L020","speaker":"N","text":"Allison later told the Wall Street Journal, as Fortune reported: \"So we maxed out our credit cards, sold one of our cars to buy bottles\"...","d":8.71,"est":false,"a":70.389},{"id":"L021","speaker":"N","text":"...and opened their own factory. Her husband, she said, told her she was \"absolutely crazy\".","d":5.16,"est":false,"a":79.239},{"id":"L022","speaker":"HAL","text":"Credit cards. A car. A factory.","d":2.86,"est":false,"a":84.579},{"id":"L023","speaker":"SODA","text":"Is that a lot?","d":0.73,"est":false,"a":87.579},{"id":"L024","speaker":"HAL","text":"For a family? That's everything.","d":2.34,"est":false,"a":88.449},{"id":"L025","speaker":"SODA","text":"And if I don't sell?","d":0.84,"est":false,"a":90.929},{"id":"L026","speaker":"HAL","text":"Then you're very expensive salad dressing.","d":2.99,"est":false,"a":91.909},{"id":"L027","speaker":"N","text":"Then they practised one pitch for six months... for a stage with five investors on it.","d":4.59,"est":false,"a":95.079},{"id":"L028","speaker":"N","text":"Six months of practice. Then the lights came on.","d":2.85,"est":false,"a":100.809},{"id":"L029","speaker":"N","text":"The ask: four hundred thousand dollars for ten percent of the company. That puts the whole thing at four million.","d":6.37,"est":false,"a":103.799},{"id":"L030","speaker":"N","text":"Accounts of the episode say the investors pushed hard. One worried how much more money it would need. One disliked the valuation. Others objected to the plan to run their own factory.","d":11.2,"est":false,"a":110.309},{"id":"L031","speaker":"SODA","text":"No. No. No. No...","d":1.3,"est":false,"a":121.689},{"id":"L032","speaker":"BENNY","text":"That's four.","d":0.75,"est":false,"a":123.129},{"id":"L033","speaker":"SODA","text":"...Anyone? Anyone at all?","d":1.33,"est":false,"a":124.019},{"id":"L034","speaker":"N","text":"The fifth chair was Rohan Oza's. Four hundred thousand dollars... for twenty-five percent.","d":5.4,"est":false,"a":125.529},{"id":"L035","speaker":"N","text":"Same money, two and a half times the share. By our arithmetic, his offer valued the company at one point six million dollars, not four.","d":8.59,"est":false,"a":131.069},{"id":"L036","speaker":"CHAD","text":"Four million, bro. Ten percent.","d":1.687,"est":false,"a":139.839},{"id":"L037","speaker":"HAL","text":"One point six. A quarter.","d":2.38,"est":false,"a":141.666},{"id":"L038","speaker":"CHAD","text":"That's robbery!","d":0.84,"est":false,"a":144.186},{"id":"L039","speaker":"HAL","text":"That's a deal.","d":1.19,"est":false,"a":145.166},{"id":"L040","speaker":"SODA","text":"...I'll take it.","d":0.73,"est":false,"a":146.496},{"id":"L041","speaker":"N","text":"She took it. She remembers thinking, \"this moment right here could change my life.\"","d":4.58,"est":false,"a":147.406},{"id":"L042","speaker":"N","text":"Ten days after the pitch, her son was born.","d":2.64,"est":false,"a":152.126},{"id":"L043","speaker":"MARTHA","text":"Visiting hours are over.","d":1.46,"est":false,"a":154.946},{"id":"L044","speaker":"SODA","text":"I'm family. Sort of.","d":1.27,"est":false,"a":156.546},{"id":"L045","speaker":"MARTHA","text":"You're a beverage.","d":0.88,"est":false,"a":157.956},{"id":"L046","speaker":"N","text":"The episode aired on Sunday the ninth of December, 2018.","d":4.09,"est":false,"a":159.016},{"id":"L047","speaker":"MARTHA","text":"Twenty-five percent of a vinegar company.","d":2.3,"est":false,"a":163.286},{"id":"L048","speaker":"BENNY","text":"Is that good?","d":0.92,"est":false,"a":165.726},{"id":"L049","speaker":"MARTHA","text":"Depends what the other seventy-five turns into.","d":2.54,"est":false,"a":166.786},{"id":"L050","speaker":"BENNY","text":"When do we find out?","d":1.13,"est":false,"a":169.466},{"id":"L051","speaker":"MARTHA","text":"Ask me in six years.","d":1.22,"est":false,"a":170.736},{"id":"L052","speaker":"N","text":"Years later, Oza recalled what he had seen in that pitch.","d":3.3,"est":false,"a":172.136},{"id":"L053","speaker":"N","text":"\"Package, wrong. Brand, wrong. Everything is wrong, basically. But this liquid, that's it.\"","d":5.2,"est":false,"a":175.576},{"id":"L054","speaker":"CHAD","text":"Label, wrong. Bottle, wrong.","d":1.42,"est":false,"a":180.956},{"id":"L055","speaker":"SODA","text":"And me?","d":0.45,"est":false,"a":182.516},{"id":"L056","speaker":"CHAD","text":"You, I keep.","d":0.73,"est":false,"a":183.106},{"id":"L057","speaker":"N","text":"He had bought the drink. Now he wanted a new word on it.","d":2.86,"est":false,"a":184.016},{"id":"L058","speaker":"N","text":"The first thing to go was the name.","d":1.84,"est":false,"a":188.016},{"id":"L059","speaker":"N","text":"According to Mashed, \"Mother\" could not be trademarked.","d":2.91,"est":false,"a":189.996},{"id":"L060","speaker":"SODA","text":"I'd like to own my name, please.","d":1.51,"est":false,"a":193.086},{"id":"L061","speaker":"REGGIE","text":"Not that one.","d":1.45,"est":false,"a":194.736},{"id":"L062","speaker":"SODA","text":"...What about my face?","d":0.99,"est":false,"a":196.326},{"id":"L063","speaker":"REGGIE","text":"Next.","d":0.91,"est":false,"a":197.456},{"id":"L064","speaker":"N","text":"Later, Oza put it more politely: \"The name and package were not conducive of the big picture that we're trying to solve.\"","d":6.9,"est":false,"a":198.546},{"id":"L065","speaker":"N","text":"So in 2020 the bottle became a can. The name became Poppi. The label said \"prebiotic soda\".","d":6.91,"est":false,"a":205.586},{"id":"L066","speaker":"SODA","text":"Same soda. New word.","d":1.5,"est":false,"a":212.676},{"id":"L067","speaker":"BENNY","text":"You look... expensive.","d":1.3,"est":false,"a":214.316},{"id":"L068","speaker":"SODA","text":"I feel expensive.","d":0.93,"est":false,"a":215.756},{"id":"L069","speaker":"BENNY","text":"You taste the same.","d":1.09,"est":false,"a":216.826},{"id":"L070","speaker":"SODA","text":"Don't tell anyone.","d":0.86,"est":false,"a":218.056},{"id":"L071","speaker":"N","text":"Oza's firm, CAVU Consumer Partners, backed it. PepsiCo would later say CAVU funded Poppi from its first seed round.","d":7.51,"est":false,"a":219.096},{"id":"L072","speaker":"N","text":"The launch was set for March 2020... at a trade show that Covid cancelled.","d":4.83,"est":false,"a":226.746},{"id":"L073","speaker":"SODA","text":"Where is everybody?","d":0.88,"est":false,"a":231.756},{"id":"L074","speaker":"BENNY","text":"Home. Everybody's home.","d":1.47,"est":false,"a":232.776},{"id":"L075","speaker":"SODA","text":"Then I'm going to their homes.","d":1.33,"est":false,"a":234.386},{"id":"L076","speaker":"N","text":"So they sold online, through Amazon and online grocers. By the end of 2020, one report says, sales were about four million dollars.","d":9.7,"est":false,"a":235.896},{"id":"L077","speaker":"N","text":"Then came one video. Food Republic reports that a TikTok of Allison added a hundred thousand in sales within a day.","d":7.23,"est":false,"a":245.736},{"id":"L078","speaker":"CHAD","text":"Bro. The can is viral.","d":1.27,"est":false,"a":253.146},{"id":"L079","speaker":"SODA","text":"I'm a soda.","d":0.705,"est":false,"a":254.556},{"id":"L080","speaker":"CHAD","text":"Not anymore. Now you're content.","d":1.47,"est":false,"a":255.401},{"id":"L081","speaker":"SODA","text":"Is that better?","d":0.71,"est":false,"a":257.011},{"id":"L082","speaker":"CHAD","text":"It's louder.","d":0.71,"est":false,"a":257.861},{"id":"L083","speaker":"N","text":"But sales are not cash. Allison told Entrepreneur that at twenty million dollars of revenue, the company had seventy-five thousand dollars in the bank... and wasn't sure it could make payroll.","d":11.46,"est":false,"a":258.751},{"id":"L084","speaker":"N","text":"Stephen remembers \"begging and pleading\" with suppliers for more time to pay.","d":4.53,"est":false,"a":270.351},{"id":"L085","speaker":"HAL","text":"Pay Friday.","d":1.24,"est":false,"a":275.061},{"id":"L086","speaker":"SODA","text":"How about... a Friday?","d":1.31,"est":false,"a":276.441},{"id":"L087","speaker":"HAL","text":"Which one?","d":0.95,"est":false,"a":277.891},{"id":"L088","speaker":"N","text":"They needed money that didn't come from a credit card.","d":2.9,"est":false,"a":279.021},{"id":"L089","speaker":"N","text":"The money came... with famous faces attached.","d":2.87,"est":false,"a":283.061},{"id":"L090","speaker":"N","text":"In August 2021, Poppi raised thirteen million dollars, led by Oza's firm. Celebrities such as Halsey and Russell Westbrook joined in, Dallas Innovates reported.","d":11.68,"est":false,"a":286.071},{"id":"L091","speaker":"CHAD","text":"Can in hand. Chin up.","d":1.02,"est":false,"a":297.931},{"id":"L092","speaker":"SODA","text":"Does anyone actually drink me?","d":1.62,"est":false,"a":299.091},{"id":"L093","speaker":"CHAD","text":"Nobody sips, bro. They post.","d":1.623,"est":false,"a":300.851},{"id":"L094","speaker":"N","text":"The cans sold for two dollars forty-nine each, in more than seven thousand five hundred stores.","d":5.83,"est":false,"a":302.654},{"id":"L095","speaker":"BENNY","text":"Two forty-nine. For one can.","d":1.877,"est":false,"a":308.664},{"id":"L096","speaker":"MARTHA","text":"You're not buying a soda.","d":1.25,"est":false,"a":310.681},{"id":"L097","speaker":"BENNY","text":"Then what am I buying?","d":1.25,"est":false,"a":312.071},{"id":"L098","speaker":"MARTHA","text":"A picture of you holding it.","d":1.4,"est":false,"a":313.461},{"id":"L099","speaker":"BENNY","text":"...It is a nice picture.","d":1.3,"est":false,"a":315.001},{"id":"L100","speaker":"N","text":"In December 2022, another twenty-five million dollars. Sales had grown a hundred and forty-eight percent in a year.","d":8.15,"est":false,"a":316.481},{"id":"L101","speaker":"N","text":"By 2024, the company says, revenue was about five hundred million dollars. By our arithmetic, that's more than a hundred times 2020.","d":10.01,"est":false,"a":324.771},{"id":"L102","speaker":"CHAD","text":"Four million to five hundred million!","d":1.76,"est":false,"a":334.961},{"id":"L103","speaker":"HAL","text":"Sales. Not profit.","d":1.62,"est":false,"a":336.861},{"id":"L104","speaker":"CHAD","text":"Same thing!","d":0.72,"est":false,"a":338.621},{"id":"L105","speaker":"HAL","text":"It is not.","d":1.16,"est":false,"a":339.481},{"id":"L106","speaker":"N","text":"Then the biggest stage of all: the Super Bowl, on the ninth of February 2025. You may have seen the ad.","d":7.05,"est":false,"a":340.821},{"id":"L107","speaker":"BENNY","text":"What does a Super Bowl ad even cost?","d":1.96,"est":false,"a":348.051},{"id":"L108","speaker":"CHAD","text":"Doesn't matter. Everybody saw the can.","d":1.899,"est":false,"a":350.151},{"id":"L109","speaker":"BENNY","text":"I was looking at the snacks.","d":1.34,"est":false,"a":352.19},{"id":"L110","speaker":"N","text":"Before its ad, Poppi sent branded vending machines to thirty-two influencers.","d":4.769,"est":false,"a":353.71},{"id":"L111","speaker":"N","text":"A rival brand, Olipop, posted that each machine cost twenty-five thousand dollars. Keep that number in mind.","d":7,"est":false,"a":358.619},{"id":"L112","speaker":"CHAD","text":"Twenty-five grand for a fridge?","d":1.61,"est":false,"a":365.799},{"id":"L113","speaker":"SODA","text":"Less! Way less!","d":0.87,"est":false,"a":367.549},{"id":"L114","speaker":"CHAD","text":"How much less?","d":0.85,"est":false,"a":368.559},{"id":"L115","speaker":"SODA","text":"...Less.","d":0.51,"est":false,"a":369.549},{"id":"L116","speaker":"N","text":"A Poppi spokesperson called the figure \"not only fabricated but inflated by sixty percent\". Allison posted a TikTok blaming \"misinformation\" from \"one of our competitors\".","d":11.15,"est":false,"a":370.239},{"id":"L117","speaker":"N","text":"A fight about a fridge. But the fridge was not the point. And PepsiCo's own try was about to be reported dead.","d":7.09,"est":false,"a":381.529},{"id":"L118","speaker":"N","text":"Because PepsiCo had tried to build one.","d":2.27,"est":false,"a":389.759},{"id":"L119","speaker":"N","text":"Its own prebiotic soda was called Soulboost. In March 2025, days before the deal, Bloomberg reported it had been scrapped.","d":9.05,"est":false,"a":392.169},{"id":"L120","speaker":"GIANT","text":"Fiber. Fizz. Fruit. Perfect.","d":2.49,"est":false,"a":401.399},{"id":"L121","speaker":"HAL","text":"And the cool kids?","d":1.52,"est":false,"a":404.029},{"id":"L122","speaker":"GIANT","text":"They'll come.","d":0.9,"est":false,"a":405.689},{"id":"L123","speaker":"GIANT","text":"Build one?","d":0.95,"est":false,"a":406.729},{"id":"L124","speaker":"MARTHA","text":"Tried that.","d":0.74,"est":false,"a":407.819},{"id":"L125","speaker":"GIANT","text":"Borrow one?","d":1.02,"est":false,"a":408.699},{"id":"L126","speaker":"MARTHA","text":"Nobody lends you a can.","d":1.33,"est":false,"a":409.859},{"id":"L127","speaker":"GIANT","text":"Then... buy one.","d":1.34,"est":false,"a":411.329},{"id":"L128","speaker":"N","text":"Coca-Cola had launched its own, called Simply Pop. And Olipop, the brand behind the fridge post, was valued at one point eight five billion dollars in February 2025, according to CNBC.","d":13.55,"est":false,"a":412.849},{"id":"L129","speaker":"N","text":"Olipop's chief executive, Ben Goodwin, had said in 2023 that both PepsiCo and Coca-Cola had approached it about a sale.","d":8.84,"est":false,"a":426.539},{"id":"L130","speaker":"GIANT","text":"Will you be mine?","d":1.24,"est":false,"a":435.559},{"id":"L131","speaker":"SODA","text":"Me? I'm vinegar.","d":1.07,"est":false,"a":436.939},{"id":"L132","speaker":"GIANT","text":"You're popular vinegar.","d":1.58,"est":false,"a":438.149},{"id":"L133","speaker":"SODA","text":"How popular?","d":0.71,"est":false,"a":439.869},{"id":"L134","speaker":"GIANT","text":"Expensive popular.","d":1.7,"est":false,"a":440.719},{"id":"L135","speaker":"N","text":"PepsiCo's chief executive, Ramon Laguarta, would later say why it wanted one: consumers, he said, have a \"growing interest in health and wellness.\"","d":9.297,"est":false,"a":442.599},{"id":"L136","speaker":"BENNY","text":"Health... It used to say gut health?","d":1.68,"est":false,"a":452.076},{"id":"L137","speaker":"SODA","text":"Shh. Not in front of the lawyers.","d":2.048,"est":false,"a":453.896},{"id":"L138","speaker":"BENNY","text":"What lawyers?","d":0.939,"est":false,"a":456.084},{"id":"L139","speaker":"SODA","text":"...Those ones.","d":0.76,"est":false,"a":457.163},{"id":"L140","speaker":"N","text":"Health was the word everyone wanted. But on Poppi's can, that word was already in court.","d":5.19,"est":false,"a":458.103},{"id":"L141","speaker":"N","text":"In May 2024, a shopper filed a class action in federal court in California. Three more suits followed, all before the same judge.","d":9.45,"est":false,"a":464.433},{"id":"L142","speaker":"N","text":"According to the lawsuit, a can held about two grams of prebiotic fiber... so you'd need more than four cans a day for any effect, with the sugar that comes with them.","d":9.61,"est":false,"a":474.023},{"id":"L143","speaker":"REGGIE","text":"Two grams of fiber?","d":2.22,"est":false,"a":483.813},{"id":"L144","speaker":"SODA","text":"Allegedly.","d":0.64,"est":false,"a":486.173},{"id":"L145","speaker":"REGGIE","text":"Four cans a day?","d":1.99,"est":false,"a":486.953},{"id":"L146","speaker":"SODA","text":"Allegedly!","d":0.66,"est":false,"a":489.083},{"id":"L147","speaker":"N","text":"Poppi denied all of it. It says its label claims were true. It told Fortune a can has three grams of fiber and five grams of sugar.","d":8.34,"est":false,"a":489.923},{"id":"L148","speaker":"N","text":"In its own words, it had also removed \"any and all references to gut health\" from its labels in late 2023.","d":7.79,"est":false,"a":498.403},{"id":"L149","speaker":"SODA","text":"Same soda. Fewer words.","d":1.685,"est":false,"a":506.373},{"id":"L150","speaker":"MARTHA","text":"Funny. Tastes the same.","d":1.34,"est":false,"a":508.198},{"id":"L151","speaker":"SODA","text":"It is the same.","d":0.812,"est":false,"a":509.678},{"id":"L152","speaker":"MARTHA","text":"Then what were the words for?","d":1.28,"est":false,"a":510.63},{"id":"L153","speaker":"N","text":"On the fourth of December 2024, a day-long mediation. On the sixteenth, the judge paused the case: a deal in principle.","d":8.69,"est":false,"a":512.09},{"id":"L154","speaker":"REGGIE","text":"Your side?","d":1.29,"est":false,"a":520.96},{"id":"L155","speaker":"HAL","text":"Not guilty. But tired.","d":2.04,"est":false,"a":522.39},{"id":"L156","speaker":"REGGIE","text":"Their side?","d":1.28,"est":false,"a":524.57},{"id":"L157","speaker":"HAL","text":"Also tired.","d":1.34,"est":false,"a":525.99},{"id":"L158","speaker":"N","text":"Three months later, Bloomberg would report PepsiCo's Soulboost scrapped.","d":4.18,"est":false,"a":527.51},{"id":"L159","speaker":"N","text":"The settlement: eight point nine million dollars. Poppi admitted no fault.","d":4.31,"est":false,"a":531.83},{"id":"L160","speaker":"N","text":"Buyers could claim about nine dollars for a twelve-pack, and at least five dollars a household.","d":5.51,"est":false,"a":536.28},{"id":"L161","speaker":"MARTHA","text":"Nine dollars.","d":0.86,"est":false,"a":541.97},{"id":"L162","speaker":"BENNY","text":"For all that soda?","d":1.132,"est":false,"a":542.97},{"id":"L163","speaker":"MARTHA","text":"For a can that talked about your gut.","d":1.74,"est":false,"a":544.242},{"id":"L164","speaker":"BENNY","text":"Allegedly.","d":0.87,"est":false,"a":546.122},{"id":"L165","speaker":"MARTHA","text":"...Next time, read the can. Every word.","d":2.07,"est":false,"a":547.132},{"id":"L166","speaker":"N","text":"Now the timing. The settlement was dated the fifth of March 2025. It was filed in court on Friday the fourteenth. On Monday the seventeenth, the buyer spoke.","d":10.38,"est":false,"a":549.382},{"id":"L167","speaker":"CHAD","text":"Friday to Monday?","d":1.132,"est":false,"a":559.942},{"id":"L168","speaker":"HAL","text":"Tidy.","d":0.84,"est":false,"a":561.214},{"id":"L169","speaker":"CHAD","text":"Is that normal?","d":0.83,"est":false,"a":562.194},{"id":"L170","speaker":"HAL","text":"It's tidy.","d":1.11,"est":false,"a":563.164},{"id":"L171","speaker":"N","text":"The lawsuit was settled on paper. The buyer could finally say its number.","d":4.09,"est":false,"a":564.454},{"id":"L172","speaker":"N","text":"Monday, the seventeenth of March 2025. PepsiCo announced it would buy Poppi.","d":5.77,"est":false,"a":569.684},{"id":"L173","speaker":"GIANT","text":"Sign here. And here. And here.","d":2.43,"est":false,"a":575.634},{"id":"L174","speaker":"SODA","text":"What am I signing?","d":0.83,"est":false,"a":578.204},{"id":"L175","speaker":"GIANT","text":"Yourself.","d":0.89,"est":false,"a":579.174},{"id":"L176","speaker":"N","text":"The price: one point nine five billion dollars. By our arithmetic, that's four thousand eight hundred and seventy-five times what Oza offered on that stage.","d":9.631,"est":false,"a":580.244},{"id":"L177","speaker":"BENNY","text":"That's a lot of briefcases.","d":1.57,"est":false,"a":590.055},{"id":"L178","speaker":"SODA","text":"Same soda. Bigger number.","d":1.59,"est":false,"a":591.765},{"id":"L179","speaker":"BENNY","text":"How many are there?","d":0.94,"est":false,"a":593.495},{"id":"L180","speaker":"SODA","text":"Don't count. Just look up.","d":1.34,"est":false,"a":594.575},{"id":"L181","speaker":"N","text":"But read the press release. That figure includes three hundred million dollars of \"anticipated cash tax benefits\".","d":6.99,"est":false,"a":596.095},{"id":"L182","speaker":"N","text":"Of every hundred dollars in the headline, about fifteen is that tax benefit. PepsiCo calls the rest, one point six five billion, the net purchase price.","d":9.69,"est":false,"a":603.225},{"id":"L183","speaker":"CHAD","text":"So it's not two billion?","d":1.12,"est":false,"a":613.095},{"id":"L184","speaker":"HAL","text":"The headline is.","d":1.46,"est":false,"a":614.355},{"id":"L185","speaker":"CHAD","text":"And the rest?","d":0.69,"est":false,"a":615.955},{"id":"L186","speaker":"HAL","text":"The rest is a promise.","d":1.964,"est":false,"a":616.785},{"id":"L187","speaker":"N","text":"On top, PepsiCo offered an earnout: more money later, if Poppi hit targets. The release gave no amount.","d":6.63,"est":false,"a":618.929},{"id":"L188","speaker":"N","text":"The deal closed on the nineteenth of May 2025.","d":3.84,"est":false,"a":625.699},{"id":"L189","speaker":"N","text":"How much went to the Ellsworths? Nobody has published the split. Fortune reported more than a hundred million dollars. No filing shows it.","d":8.11,"est":false,"a":629.679},{"id":"L190","speaker":"MARTHA","text":"Over a hundred million?","d":1.27,"est":false,"a":637.969},{"id":"L191","speaker":"HAL","text":"Reported.","d":1.09,"est":false,"a":639.379},{"id":"L192","speaker":"MARTHA","text":"I can't pay a bill with \"reported\".","d":1.8,"est":false,"a":640.609},{"id":"L193","speaker":"N","text":"Allison told Fortune that selling had been the plan \"from day one\". And with PepsiCo, she said, \"Now we have a Ferrari underneath us for distribution.\"","d":8.88,"est":false,"a":642.589},{"id":"L194","speaker":"SODA","text":"Faster!","d":0.52,"est":false,"a":651.649},{"id":"L195","speaker":"GIANT","text":"Hold on to your label.","d":1.82,"est":false,"a":652.309},{"id":"L196","speaker":"SODA","text":"Which one?","d":0.58,"est":false,"a":654.269},{"id":"L197","speaker":"N","text":"But one piece of that price was never cash. It was a promise.","d":3.56,"est":false,"a":655.029},{"id":"L198","speaker":"N","text":"Here is the part almost nobody noticed.","d":2.41,"est":false,"a":659.729},{"id":"L199","speaker":"N","text":"According to Bloomberg, that earnout could reach three hundred million dollars, for targets due by the third quarter of 2027.","d":8.08,"est":false,"a":662.279},{"id":"L200","speaker":"N","text":"In December 2025, PepsiCo valued it at two hundred and seventy-eight million. By June 2026, a hundred and seventeen million. As of the fifth of September 2026, a filing said about twelve million.","d":15.31,"est":false,"a":670.499},{"id":"L201","speaker":"SODA","text":"Is that... my bonus?","d":1.3,"est":false,"a":685.989},{"id":"L202","speaker":"HAL","text":"What's left of it.","d":1.388,"est":false,"a":687.429},{"id":"L203","speaker":"SODA","text":"It could have been three hundred million!","d":1.5,"est":false,"a":688.957},{"id":"L204","speaker":"HAL","text":"Could have.","d":0.91,"est":false,"a":690.597},{"id":"L205","speaker":"N","text":"By our arithmetic, of every hundred dollars PepsiCo once expected to pay, it now expects about four. Bloomberg reported the cut in October 2026.","d":10.698,"est":false,"a":691.687},{"id":"L206","speaker":"N","text":"Ken Shea of Bloomberg Intelligence said that at this rate, it \"seems plausible\" PepsiCo may not pay any of it. PepsiCo said Poppi grew its sales volume by double digits in the third quarter and gained share.","d":12.76,"est":false,"a":702.525},{"id":"L207","speaker":"GIANT","text":"Sales are up!","d":1.15,"est":false,"a":715.465},{"id":"L208","speaker":"MARTHA","text":"Then why is the bonus down?","d":1.53,"est":false,"a":716.755},{"id":"L209","speaker":"GIANT","text":"Volume is up!","d":1.39,"est":false,"a":718.425},{"id":"L210","speaker":"MARTHA","text":"That's not what I asked.","d":1.24,"est":false,"a":719.955},{"id":"L211","speaker":"GIANT","text":"...Next question.","d":1.25,"est":false,"a":721.335},{"id":"L212","speaker":"N","text":"So where does this touch you? In your fridge. The class action covered cans bought from late January 2020, and its claim deadline closed on the twenty-sixth of September 2025.","d":12.13,"est":false,"a":722.765},{"id":"L213","speaker":"BENNY","text":"This one just says soda.","d":1.44,"est":false,"a":735.075},{"id":"L214","speaker":"SODA","text":"Read the small print.","d":0.91,"est":false,"a":736.655},{"id":"L215","speaker":"BENNY","text":"It says... soda.","d":1.09,"est":false,"a":737.705},{"id":"L216","speaker":"N","text":"And next time you stand in the soda aisle, read the word on the can. Somebody paid a lot of money for it.","d":5.89,"est":false,"a":738.975},{"id":"L217","speaker":"N","text":"The founders started again. On the ninth of November 2026, they launched a new drink, Jetty, at two forty-nine a bottle, paid for with two and a half million dollars of their own.","d":11.47,"est":false,"a":745.005},{"id":"L218","speaker":"N","text":"Allison told Modern Retail: \"No one is excited to see me win again.\"","d":4.39,"est":false,"a":756.615},{"id":"L219","speaker":"BENNY","text":"New bottle. New word.","d":1.29,"est":false,"a":761.185},{"id":"L220","speaker":"SODA","text":"Same founders.","d":0.875,"est":false,"a":762.615},{"id":"L221","speaker":"N","text":"The next date to watch: PepsiCo's next quarterly filing, when the value of that bonus can change again.","d":6.38,"est":false,"a":763.67},{"id":"L222","speaker":"SODA","text":"Same soda.","d":0.74,"est":false,"a":770.23},{"id":"L223","speaker":"BENNY","text":"Different word.","d":0.939,"est":false,"a":771.11},{"id":"L224","speaker":"N","text":"So how did Poppi make one point nine five billion dollars from soda? It changed the word on the can, not the soda... and the number was never quite that big.","d":10,"est":false,"a":772.229}], 783.229);
