e,"a":0.2},{"id":"L002","speaker":"N","text":"In the one lit chair: Rohan Oza. He is about to offer her four hundred thousand dollars.","wt":[[0,0.121],[0.156,0.225],[0.307,0.492],[0.527,0.701],[0.748,1.247],[1.451,1.903],[2.008,2.588],[2.718,2.834],[2.904,2.985],[3.032,3.287],[3.31,3.357],[3.438,3.693],[3.763,3.844],[3.937,4.146],[4.193,4.437],[4.471,4.831],[4.878,5.36]],"d":5.36,"est":false,"a":9.28},{"id":"L003","speaker":"SODA","text":"Psst. Don't get too attached to me.","wt":[[0,0.323],[0.5,0.709],[0.744,0.86],[0.895,1.023],[1.069,1.371],[1.394,1.441],[1.487,1.71]],"d":1.71,"est":false,"a":14.82},{"id":"L004","speaker":"N","text":"We know what they don't. One day, a cola giant will pay one point nine five billion dollars for this drink.","wt":[[0,0.126],[0.172,0.288],[0.312,0.416],[0.439,0.544],[0.613,1.055],[1.232,1.465],[1.499,1.766],[1.79,1.836],[1.964,2.324],[2.393,2.707],[2.742,2.881],[2.916,3.044],[3.148,3.357],[3.427,3.671],[3.763,4.019],[4.088,4.379],[4.414,4.715],[4.762,5.075],[5.11,5.203],[5.238,5.366],[5.4,5.71]],"d":5.71,"est":false,"a":16.71},{"id":"L005","speaker":"BENNY","text":"Two billion dollars? For vinegar?","wt":[[0,0.192],[0.273,0.599],[0.645,1.167],[1.318,1.469],[1.539,2.03]],"d":2.03,"est":false,"a":22.6},{"id":"L006","speaker":"SODA","text":"Same soda. Keep watching.","wt":[[0,0.27],[0.305,0.642],[0.781,0.955],[1.013,1.36]],"d":1.36,"est":false,"a":24.77},{"id":"L007","speaker":"BENNY","text":"Is she okay up there?","wt":[[0,0.109],[0.156,0.272],[0.342,0.609],[0.655,0.736],[0.771,1.05]],"d":1.05,"est":false,"a":26.27},{"id":"L008","speaker":"SODA","text":"She's fine. I'm the one sweating.","wt":[[0,0.267],[0.313,0.673],[0.987,1.184],[1.219,1.289],[1.335,1.474],[1.509,1.96]],"d":1.96,"est":false,"a":27.46},{"id":"L009","speaker":"N","text":"Her son will be born ten days after this pitch.","wt":[[0,0.169],[0.25,0.424],[0.459,0.587],[0.633,0.703],[0.738,1.017],[1.086,1.353],[1.423,1.667],[1.748,2.015],[2.061,2.189],[2.259,2.62]],"d":2.62,"est":false,"a":29.6},{"id":"L010","speaker":"N","text":"And that big number has a part almost nobody noticed.","wt":[[0,0.143],[0.212,0.363],[0.456,0.653],[0.7,0.92],[0.967,1.095],[1.164,1.187],[1.257,1.443],[1.489,1.803],[1.896,2.302],[2.383,2.89]],"d":2.89,"est":false,"a":32.36},{"id":"L011","speaker":"N","text":"So how did Poppi make one point nine five billion dollars from soda?","wt":[[0,0.163],[0.232,0.325],[0.36,0.453],[0.488,0.789],[0.836,0.998],[1.068,1.242],[1.289,1.533],[1.625,1.881],[1.927,2.206],[2.241,2.543],[2.589,2.879],[2.914,3.03],[3.111,3.6]],"d":3.6,"est":false,"a":35.39},{"id":"L012","speaker":"N","text":"It starts around 2015, in a family kitchen. Allison has stomach troubles. So she mixes apple cider vinegar, fruit and soda water.","wt":[[0,0.144],[0.191,0.481],[0.516,0.748],[0.818,1.828],[1.955,2.083],[2.118,2.141],[2.234,2.664],[2.733,3.29],[3.398,3.804],[3.851,3.979],[4.048,4.408],[4.455,5.023],[5.146,5.308],[5.378,5.482],[5.564,5.912],[6.005,6.341],[6.376,6.643],[6.725,7.131],[7.201,7.502],[7.572,7.758],[7.839,8.118],[8.164,8.52]],"d":8.52,"est":false,"a":39.13},{"id":"L013","speaker":"N","text":"Her husband, Stephen, helps sell it at farmers' markets in Dallas. Within months, a Whole Foods buyer agrees to stock it.","wt":[[0,0.149],[0.195,0.555],[0.579,1.194],[1.426,1.693],[1.728,1.972],[2.018,2.076],[2.111,2.181],[2.262,2.668],[2.703,3.063],[3.098,3.156],[3.226,3.88],[3.947,4.26],[4.342,4.632],[4.667,4.713],[4.806,5.05],[5.073,5.375],[5.421,5.665],[5.735,6.048],[6.083,6.141],[6.211,6.524],[6.594,6.7]],"d":6.7,"est":false,"a":47.79},{"id":"L014","speaker":"MARTHA","text":"Vinegar. In a soda.","wt":[[0,0.604],[0.738,0.877],[0.923,0.947],[0.993,1.515]],"d":1.515,"est":false,"a":54.67},{"id":"L015","speaker":"SODA","text":"With fruit!","wt":[[0,0.202],[0.237,0.52]],"d":0.52,"est":false,"a":56.325},{"id":"L016","speaker":"MARTHA","text":"Who drinks vinegar on purpose?","wt":[[0,0.154],[0.212,0.479],[0.537,0.862],[0.932,1.037],[1.106,1.7]],"d":1.7,"est":false,"a":56.985},{"id":"L017","speaker":"SODA","text":"People with stomachs?","wt":[[0,0.229],[0.263,0.403],[0.438,0.99]],"d":0.99,"est":false,"a":58.825},{"id":"L018","speaker":"MARTHA","text":"...Fine. You're in.","wt":[[0,0.623],[0.693,0.96],[1.006,1.35]],"d":1.35,"est":false,"a":59.955},{"id":"L019","speaker":"N","text":"The first eighteen months bring in about five hundred thousand dollars of sales. Growing costs far more.","wt":[[0,0.094],[0.164,0.489],[0.559,0.988],[1.058,1.29],[1.325,1.522],[1.592,1.65],[1.696,1.894],[1.987,2.335],[2.37,2.602],[2.648,2.997],[3.043,3.322],[3.357,3.403],[3.449,3.972],[4.23,4.601],[4.647,4.996],[5.077,5.321],[5.402,5.77]],"d":5.77,"est":false,"a":61.485},{"id":"L020","speaker":"N","text":"Allison later told the Wall Street Journal, as Fortune reported: \"So we maxed out our credit cards, sold one of our cars to buy bottles\"...","wt":[[0,0.469],[0.539,0.748],[0.818,1.015],[1.05,1.119],[1.201,1.433],[1.479,1.7],[1.77,2.222],[2.299,2.474],[2.566,2.926],[2.95,3.576],[3.6,3.891],[3.96,4.065],[4.146,4.471],[4.506,4.611],[4.645,4.727],[4.773,5.005],[5.04,5.563],[5.795,6.097],[6.143,6.236],[6.259,6.306],[6.352,6.433],[6.503,6.77],[6.805,6.851],[6.921,7.037],[7.107,7.63]],"d":7.63,"est":false,"a":67.395},{"id":"L021","speaker":"N","text":"...and opened their own factory. Her husband, she said, told her she was \"absolutely crazy\".","wt":[[0,0.244],[0.325,0.615],[0.639,0.789],[0.871,1.08],[1.173,1.834],[1.938,2.1],[2.147,2.53],[2.553,2.669],[2.75,3.076],[3.11,3.319],[3.354,3.424],[3.47,3.563],[3.633,3.749],[3.819,4.573],[4.643,5.26]],"d":5.26,"est":false,"a":75.165},{"id":"L022","speaker":"HAL","text":"Credit cards. A car. A factory.","wt":[[0,0.288],[0.323,0.86],[0.937,1.019],[1.088,1.68],[1.742,1.811],[1.893,2.44]],"d":2.44,"est":false,"a":80.605},{"id":"L023","speaker":"SODA","text":"Is that a lot?","wt":[[0,0.133],[0.179,0.307],[0.353,0.376],[0.434,0.65]],"d":0.65,"est":false,"a":83.185},{"id":"L024","speaker":"HAL","text":"For a family? That's everything.","wt":[[0,0.126],[0.161,0.184],[0.242,0.85],[0.904,1.136],[1.194,1.71]],"d":1.71,"est":false,"a":83.975},{"id":"L025","speaker":"SODA","text":"And if I don't sell?","wt":[[0,0.113],[0.159,0.217],[0.275,0.298],[0.345,0.542],[0.589,0.96]],"d":0.96,"est":false,"a":85.825},{"id":"L026","speaker":"HAL","text":"Then you're very expensive salad dressing.","wt":[[0,0.107],[0.142,0.316],[0.351,0.572],[0.641,1.141],[1.175,1.524],[1.559,2.05]],"d":2.05,"est":false,"a":86.925},{"id":"L027","speaker":"N","text":"Then they practised one pitch for six months... for a stage with five investors on it.","wt":[[0,0.117],[0.152,0.257],[0.338,0.779],[0.86,1.011],[1.046,1.244],[1.29,1.394],[1.464,1.685],[1.766,2.21],[2.331,2.493],[2.54,2.563],[2.61,2.958],[2.981,3.109],[3.19,3.48],[3.515,3.991],[4.061,4.177],[4.212,4.37]],"d":4.37,"est":false,"a":89.155},{"id":"L028","speaker":"N","text":"Six months of practice. Then the lights came on.","wt":[[0,0.313],[0.395,0.615],[0.639,0.697],[0.778,1.509],[1.647,1.879],[1.926,1.995],[2.03,2.262],[2.332,2.518],[2.564,2.83]],"d":2.83,"est":false,"a":94.665},{"id":"L029","speaker":"N","text":"The ask: four hundred thousand dollars for ten percent of the company. That puts the whole thing at four million.","wt":[[0,0.143],[0.224,0.781],[1.284,1.551],[1.621,1.877],[1.923,2.283],[2.329,2.62],[2.689,2.794],[2.875,3.096],[3.177,3.444],[3.467,3.514],[3.548,3.618],[3.653,4.129],[4.272,4.493],[4.563,4.783],[4.818,4.899],[4.946,5.19],[5.236,5.468],[5.538,5.619],[5.712,6.002],[6.095,6.65]],"d":6.65,"est":false,"a":97.635},{"id":"L030","speaker":"N","text":"Accounts of the episode say the investors pushed hard: on how much more money it would need, on the valuation, on the plan to run their own factory.","wt":[[0,0.464],[0.499,0.557],[0.592,0.661],[0.708,1.219],[1.265,1.404],[1.474,1.544],[1.59,2.124],[2.217,2.565],[2.658,3.192],[3.302,3.43],[3.511,3.627],[3.673,3.836],[3.906,4.103],[4.15,4.347],[4.393,4.451],[4.486,4.614],[4.684,5.125],[5.217,5.356],[5.391,5.461],[5.53,6.599],[6.718,6.846],[6.881,6.95],[6.997,7.252],[7.322,7.391],[7.473,7.635],[7.67,7.821],[7.856,7.972],[8.053,8.76]],"d":8.76,"est":false,"a":104.425},{"id":"L031","speaker":"SODA","text":"No. No. No. No...","wt":[[0,0.328],[0.444,0.63],[0.677,0.839],[0.886,1.15]],"d":1.15,"est":false,"a":113.365},{"id":"L032","speaker":"BENNY","text":"That's four.","wt":[[0,0.262],[0.332,0.74]],"d":0.74,"est":false,"a":114.655},{"id":"L033","speaker":"SODA","text":"...Anyone? Anyone at all?","wt":[[0,0.426],[0.542,0.878],[0.913,0.96],[1.006,1.2]],"d":1.2,"est":false,"a":115.535},{"id":"L034","speaker":"N","text":"The fifth chair was Rohan Oza's. He would pay the full ask... for twenty-five percent.","wt":[[0,0.099],[0.169,0.378],[0.413,0.61],[0.657,0.773],[0.854,1.225],[1.318,1.899],[2.079,2.183],[2.23,2.369],[2.392,2.543],[2.59,2.659],[2.752,3.019],[3.112,3.472],[3.635,3.751],[3.797,4.25],[4.285,4.75]],"d":4.75,"est":false,"a":116.915},{"id":"L035","speaker":"N","text":"Same money, two and a half times the share. By our arithmetic, his offer valued the company at one point six million dollars, not four.","wt":[[0,0.36],[0.406,0.813],[0.915,1.124],[1.205,1.275],[1.31,1.333],[1.379,1.565],[1.611,1.937],[1.983,2.053],[2.099,2.598],[2.695,2.869],[2.939,3.043],[3.066,3.693],[3.717,3.844],[3.926,4.181],[4.251,4.587],[4.61,4.68],[4.715,5.028],[5.098,5.179],[5.261,5.458],[5.504,5.748],[5.83,6.062],[6.143,6.398],[6.433,6.956],[7.118,7.327],[7.397,7.77]],"d":7.77,"est":false,"a":121.805},{"id":"L036","speaker":"CHAD","text":"Four million, bro. Ten percent.","wt":[[0,0.232],[0.267,0.557],[0.58,0.871],[0.917,1.103],[1.161,1.63]],"d":1.63,"est":false,"a":129.755},{"id":"L037","speaker":"HAL","text":"One point six. A quarter.","wt":[[0,0.166],[0.201,0.398],[0.444,0.944],[1.129,1.211],[1.269,1.61]],"d":1.61,"est":false,"a":131.525},{"id":"L038","speaker":"CHAD","text":"That's robbery!","wt":[[0,0.285],[0.39,1.01]],"d":1.01,"est":false,"a":133.275},
