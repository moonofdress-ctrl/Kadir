<!doctype html>
<!-- Channel art drawn by the rig: /brand.html?kind=banner (2560x1440, safe area 1546x423 in the middle) or ?kind=avatar (800x800).
     Saved to PNG by: node studio/tools/stills.mjs brand -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>brand</title>
    <link rel="stylesheet" href="engine/studio.css" />
    <script src="vendor/gsap.min.js"></script>
    <script src="engine/rig.js"></script>
    <style>
      html, body { margin: 0; overflow: hidden; background: #1b1d36; width: auto; height: auto; }
      svg { display: block; }
      .n { font-family: "Anton", sans-serif; }
    </style>
  </head>
  <body>
    <script>
      const NS = "http://www.w3.org/2000/svg", kind = new URLSearchParams(location.search).get("kind") || "banner", name = "CUTOUT BILLIONS";
      const W = kind === "avatar" ? 800 : 2560, H = kind === "avatar" ? 800 : 1440;
      const svg = document.createElementNS(NS, "svg"); svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H); document.body.appendChild(svg);
      const add = (html) => { const g = document.createElementNS(NS, "g"); g.innerHTML = html; svg.appendChild(g); return g; };
      const fig = (o, x, y, k) => { const w = document.createElementNS(NS, "g"); w.setAttribute("transform", `translate(${x},${y}) scale(${k})`); svg.appendChild(w); const r = Rig.make(o.who, o); w.appendChild(r.el); Rig.init(r, o.face || "neutral", o.pose || "rest"); };
      const ink = 'stroke="#1b1d36" stroke-width="10" stroke-linejoin="round"';
      if (kind === "avatar") {
        add(`<rect width="800" height="800" fill="#e8a317"/><circle cx="400" cy="400" r="330" fill="#f6f1e4" ${ink}/>`);
        fig({ who: "BENNY", face: "shocked" }, 400, 1010, 1.5);
      } else {
        add(`<rect width="2560" height="1440" fill="#e8a317"/>`);
        for (let i = 0; i < 9; i++) add(`<rect x="${-60 + i * 320}" y="${i % 2 ? 180 : 1010}" width="250" height="150" rx="10" fill="#1fa85b" ${ink} transform="rotate(${i % 2 ? -8 : 7} ${i * 320} 600)"/><circle cx="${65 + i * 320}" cy="${i % 2 ? 255 : 1085}" r="42" fill="#bfe8cf" ${ink} transform="rotate(${i % 2 ? -8 : 7} ${i * 320} 600)"/>`);
        // everything that matters sits inside the 1546x423 safe area (x 507-2053, y 508-931)
        add(`<rect x="507" y="508" width="1546" height="423" fill="#1b1d36"/><text class="n" x="1480" y="730" font-size="150" text-anchor="middle" fill="#f6f1e4">${name}</text><text x="1480" y="822" font-size="40" text-anchor="middle" fill="#ffe14d" font-family="Inter Tight" font-weight="800" letter-spacing="4">BIG MONEY NEWS, CUT OUT AND EXPLAINED</text>`);
        fig({ who: "BENNY", face: "shocked", prop: "wallet" }, 700, 930, 0.62);
        fig({ thing: "box", label: "MARKET", face: "greedy" }, 2290, 1330, 1.1); fig({ thing: "note", label: "$100", face: "panic", pose: "panic" }, 300, 1300, 1.0);
      }
    </script>
  </body>
</html>
