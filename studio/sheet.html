<!doctype html>
<!-- Contact sheet for reviews: /sheet.html?t=1,5,9.5,14&cols=2 shows those frames side by side (served by tools/preview.mjs). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>frames</title>
    <style>
      body { margin: 0; background: #111; display: grid; gap: 4px; }
      .f { position: relative; overflow: hidden; }
      iframe { border: 0; width: 100%; height: 100%; display: block; }
      .f span { position: absolute; left: 0; top: 0; background: #000c; color: #ff0; font: bold 14px monospace; padding: 2px 6px; }
    </style>
  </head>
  <body>
    <script>
      const q = new URLSearchParams(location.search), ts = (q.get("t") || "0").split(","), cols = +(q.get("cols") || 2);
      const w = Math.floor((window.innerWidth - (cols - 1) * 4) / cols), h = Math.round(w * 9 / 16);
      document.body.style.gridTemplateColumns = `repeat(${cols}, ${w}px)`;
      for (const t of ts) {
        const f = document.createElement("div"); f.className = "f"; f.style.width = w + "px"; f.style.height = h + "px";
        f.innerHTML = `<iframe src="index.html?fit&t=${t}"></iframe><span>${t}s</span>`;
        document.body.appendChild(f);
      }
    </script>
  </body>
</html>
